   ICU build, which is how one screen ended up showing `ZAR 8 700,00` in a

/* =================================================================== map */
const MAP_W = 2000, MAP_H = 1000;
const proj = (lat, lon) => [((lon + 180) / 360) * MAP_W, ((90 - lat) / 180) * MAP_H];

function drawMap(host, lanes, opts = {}) {
  const pts = [];
  lanes.forEach((l) => {
    [l.origin, l.destination].forEach((c) => {
      const p = PLACES[c];
      if (p) pts.push({ code: c, name: p[0], xy: proj(p[1], p[2]) });
    });
  });
  if (!pts.length) { host.innerHTML = `<div class="center muted small" style="padding:40px">No corridors yet.</div>`; return; }

  const xs = pts.map((p) => p.xy[0]), ys = pts.map((p) => p.xy[1]);
  const padX = opts.pad ?? 190, padY = opts.pad ?? 150;
  let x0 = Math.min(...xs) - padX, x1 = Math.max(...xs) + padX;
  let y0 = Math.min(...ys) - padY, y1 = Math.max(...ys) + padY;
  const aspect = opts.aspect ?? 2.6;
  let w = x1 - x0, h = y1 - y0;
  if (w / h < aspect) { const need = h * aspect; const cx = (x0 + x1) / 2; x0 = cx - need / 2; x1 = cx + need / 2; w = need; }
  else { const need = w / aspect; const cy = (y0 + y1) / 2; y0 = cy - need / 2; y1 = cy + need / 2; h = need; }
  x0 = Math.max(0, Math.min(x0, MAP_W - w)); y0 = Math.max(0, Math.min(y0, MAP_H - h));

  const seen = new Map();
  pts.forEach((p) => seen.set(p.code, p));

  const lanePath = (l) => {
    const a = PLACES[l.origin], b = PLACES[l.destination];
    if (!a || !b) return "";
    const [ax, ay] = proj(a[1], a[2]), [bx, by] = proj(b[1], b[2]);
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    // Bow the great-circle-ish arc perpendicular to the chord, scaled by length.
    const k = Math.min(0.17, 26 / len) * len * 0.5;
    return `M${ax.toFixed(1)} ${ay.toFixed(1)} Q${(mx - (dy / len) * k).toFixed(1)} ${(my + (dx / len) * k).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
  };

  const r = 4.6 * (w / Math.max(240, host.clientWidth || 720));
  const maxV = Math.max(...lanes.map((l) => l.value || 1), 1);
  const laneSvg = lanes.map((l) => {
    const stroke = l.tone === "critical" ? "var(--critical)" : l.tone === "rails" ? "var(--rails)" : "var(--accent)";
    const wgt = (w / Math.max(240, host.clientWidth || 720)) * (1.4 + (l.value || 1) / maxV * 2.2);
    return `<path class="lane${l.live ? " live" : ""}" d="${lanePath(l)}" stroke="${stroke}" stroke-width="${wgt.toFixed(1)}" opacity="${l.tone === "critical" ? .95 : .8}"/>`;
  }).join("");

  const nodes = [...seen.values()].map((p) => {
    const [x, y] = p.xy;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--surface)" stroke="var(--accent)" stroke-width="${(r * 0.5).toFixed(1)}"/>`;
  }).join("");

  // Greedy labels: place by descending x so western ports win ties, and drop
  // any that would collide with one already placed.
  // viewBox units per rendered pixel — glyphs are sized in screen pixels so a
  // narrow side map and a wide dashboard map are equally legible.
  const upp = w / Math.max(240, host.clientWidth || 720);
  const fs = 11.5 * upp;
  const placed = [];
  const labels = [...seen.values()].sort((a, b) => a.xy[0] - b.xy[0]).map((p) => {
    const [x, y] = p.xy;
    const box = { x: x + fs * 0.8, y: y - fs * 0.62, w: p.code.length * fs * 0.63, h: fs * 1.35 };
    if (placed.some((q) => !(box.x > q.x + q.w || box.x + box.w < q.x || box.y > q.y + q.h || box.y + box.h < q.y))) return "";
    placed.push(box);
    return `<text class="port-label" x="${(x + fs * 0.85).toFixed(1)}" y="${(y + fs * 0.36).toFixed(1)}" font-size="${fs.toFixed(1)}" stroke-width="${(fs * 0.26).toFixed(1)}">${p.code}</text>`;
  }).join("");

  host.innerHTML =
    `<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="Corridor map">
      <rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="var(--sea)"/>
      <path d="${LAND_PATH}" fill="var(--land)" stroke="var(--land-edge)" stroke-width="1"/>
      ${laneSvg}${nodes}${labels}
    </svg>`;
  return { ports: seen.size, lanes: lanes.length };
}

function resolveRule(card) {
  const match = MARGIN_RULES.filter((r) => !r.scope ||
    (r.origin === card.origin && r.destination === card.destination && r.mode === card.mode));
  return match.sort((a, b) => b.dims - a.dims)[0];
}

function priceQuote() {
  const card = RATE_CARDS.find((c) => c.id === $("#q-lane").value) || RATE_CARDS[1];
  const qty = Math.max(1, Math.min(20, Number($("#q-qty").value) || 1));
  const bps = Number($("#q-margin").value);
  const rule = resolveRule(card);
  const toZar = (c, ccy) => roundHalfUp(c * (FX[ccy] || 1));

  const mk = (code, desc, quantity, buyEach, ccy) => {
    const buy = buyEach * quantity;
    // The floor is a minimum margin per quote line, held in ZAR cents. It has
    // to be converted into the line's currency before it can be compared with
    // one — applying R1 500 as though it were $1 500 turns an 18% margin into
    // a 69% one, which is not a number any shipper would accept.
    const floorInCcy = roundHalfUp(rule.floor / (FX[ccy] || 1));
    const sell = Math.max(roundHalfUp(buy * (1 + bps / 10000)), buy + floorInCcy);
    return { code, desc, quantity, buyEach, buy, sell, ccy, buyZar: toZar(buy, ccy), sellZar: toZar(sell, ccy) };
  };

  const lines = [mk("FRT", `${card.mode} freight ${card.origin}→${card.destination} (${card.carrier})`, qty, card.buy, card.ccy)];
  const freightBuy = card.buy * qty;
  card.surcharges.forEach((s) => {
    if (s.basis === "PERCENT_OF_FREIGHT") {
      lines.push(mk(s.code, s.desc + " (% of freight)", 1, roundHalfUp(freightBuy * s.amt / 10000), s.ccy));
    } else if (s.basis === "PER_CONTAINER") {
      lines.push(mk(s.code, s.desc, qty, s.amt, s.ccy));
    } else {
      lines.push(mk(s.code, s.desc, 1, s.amt, s.ccy));
    }
  });

  const totals = {};
  lines.forEach((l) => { totals[l.ccy] = (totals[l.ccy] || 0) + l.sell; });
  S.quote = { card, qty, bps, rule, lines, totals,
    id: "Q-2026-0187", ref: "Q-2026-0187",
    marginZar: lines.reduce((s, l) => s + (l.sellZar - l.buyZar), 0),
    sellZar: lines.reduce((s, l) => s + l.sellZar, 0),
    buyZar: lines.reduce((s, l) => s + l.buyZar, 0) };
  return S.quote;
}

function renderQuote() {
  if (!$("#q-lane").options.length) {
    $("#q-lane").innerHTML = RATE_CARDS.map((c) =>
      `<option value="${c.id}"${c.id === "rc-2" ? " selected" : ""}>${c.origin} → ${c.destination} · ${c.mode}</option>`).join("");

  const q = priceQuote();

  $("#q-carrier").textContent = `${q.card.carrier} · ${q.card.kind}`;

     <div class="kv tot"><span class="k">Gross margin</span><span class="v accent">${money(q.marginZar, "ZAR")} <span class="muted" style="font-weight:400">· ${marginPct.toFixed(1)}%</span></span></div>`;

}

  if (S.step < 0) return 0;
  return Math.min(1, S.step / (LIFECYCLE.length - 1));
}

/* ---------------------------------------------------- the charge taxonomy
   29 canonical codes in the product; the ones this shipment touches are here.
   `errorRate` is not decoration — fuel, destination terminal handling and
   documentation fees carry the highest documented error rates precisely
   because AP scrutinises them least and the forwarder has the most discretion
   over them, so the audit spends its attention there. */
const CODES = {
  FRT:  { label: "Ocean freight",              cat: "FREIGHT",             basis: "container", prov: "MARKED_UP",            tax: true,  err: "LOW" },
  OHC:  { label: "Origin terminal handling",   cat: "ORIGIN",              basis: "container", prov: "PASS_THROUGH",         tax: true,  err: "MEDIUM" },
  BAF:  { label: "Bunker adjustment factor",   cat: "FUEL_SURCHARGE",      basis: "container", prov: "PASS_THROUGH",         tax: true,  err: "HIGH" },
  THC:  { label: "Destination terminal handling", cat: "DESTINATION",      basis: "container", prov: "PASS_THROUGH",         tax: true,  err: "HIGH" },
  ISPS: { label: "Port security (ISPS)",       cat: "DESTINATION",         basis: "container", prov: "PASS_THROUGH",         tax: true,  err: "MEDIUM" },
  DOC:  { label: "Documentation fee",          cat: "DOCUMENTATION",       basis: "document",  prov: "FORWARDER_ORIGINATED", tax: true,  err: "HIGH" },
  CCL:  { label: "Customs clearance",          cat: "CUSTOMS",             basis: "shipment",  prov: "FORWARDER_ORIGINATED", tax: true,  err: "MEDIUM" },
  DTY:  { label: "Customs duty & import VAT",  cat: "DUTY_TAX",            basis: "shipment",  prov: "PASS_THROUGH",         tax: false, err: "LOW" },
  DEM:  { label: "Demurrage",                  cat: "DEMURRAGE_DETENTION", basis: "day",       prov: "PASS_THROUGH",         tax: true,  err: "HIGH" },
  PLF:  { label: "Platform fee",               cat: "PLATFORM_FEE",        basis: "%",         prov: "FORWARDER_ORIGINATED", tax: true,  err: "LOW" },
  MSC:  { label: "Other charge",                cat: "OTHER",              basis: "shipment",  prov: "FORWARDER_ORIGINATED", tax: true,  err: "MEDIUM" },
};

const CAT_ORDER = ["ORIGIN", "FREIGHT", "FUEL_SURCHARGE", "DESTINATION", "CUSTOMS",
  "DUTY_TAX", "DOCUMENTATION", "DEMURRAGE_DETENTION", "PLATFORM_FEE", "OTHER"];
const CAT_LABEL = {
  ORIGIN: "Origin charges", FREIGHT: "Main carriage", FUEL_SURCHARGE: "Fuel & currency surcharges",
  DESTINATION: "Destination & port charges", CUSTOMS: "Customs clearance", DUTY_TAX: "Duties & taxes",
  DOCUMENTATION: "Documentation", DEMURRAGE_DETENTION: "Demurrage & detention", PLATFORM_FEE: "Platform fees", OTHER: "Other charges",
};
const PROV_LABEL = { PASS_THROUGH: "At cost", MARKED_UP: "Third party", FORWARDER_ORIGINATED: "Our service" };
const PROV_TAG = { PASS_THROUGH: "", MARKED_UP: "accent", FORWARDER_ORIGINATED: "rails" };

/* The issuing company, from its own billing profile. Another forwarder on the
   platform issues under its own — nothing here is a platform constant. */
const ISSUER = {
  legal: "FORGE Freight (Pty) Ltd", trading: "FORGE Freight",
  reg: "2019/447281/07", vat: "4820291837", ccn: "20418877",
  addr: "Unit 7, Bayhead Business Park · 14 Langeberg Road · Bayhead, Durban 4001",
  bank: "Standard Bank", acct: "042 118 774", branch: "051001", swift: "SBZAZAJJ",
  prefix: "FF", terms: 30, vatBps: 1500,
};

/* Charge lines carry their taxonomy, quantity and unit price, because that is
   what makes a line re-derivable — and a line that cannot be re-derived is a
   line the audit has to pass. */
function ch(code, over) {
  // Unknown codes fall back to the Other bucket rather than being dropped —
  // dropping a line loses money, and refusing the invoice stops the forwarder
  // billing at all. The fallback is visible so someone maps it.
  const d = CODES[code] || CODES.MSC;
  const qty = over.qty ?? 1;
  return {
    code, kind: over.kind || "SURCHARGE", desc: over.desc || d.label,
    cat: d.cat, prov: over.prov || d.prov, basis: d.basis, qty,
    unit: over.unit, sell: over.unit * qty, buy: over.buy ?? null,
    // What the contract says this unit should be, where a contract covers it.
    // A line with no contract reference is not wrong — it is unmatchable, and
    // the audit reports that separately.
    contract: over.contract ?? null,
    vatBps: d.tax ? ISSUER.vatBps : 0, ccy: "ZAR", on: over.on, vendor: over.vendor || null,
  };
}

function accrueFor(m, q) {
  // Idempotent on the triggering event, exactly like the real consumer: a
  // release reached from the customs screen and one reached from the lifecycle
  // are the same accrual, and billing it twice is the bug that matters most.
  if (S.charges.some((c) => c.on === m.type)) return;

  // What the billing consumer writes when this event lands. The taxonomy comes
  // from the code itself: left on the column defaults, every automatically
  // accrued line would claim to be an uncategorised charge the forwarder
  // originated with no cost behind it — the exact shape the audit passes.
  if (m.type === "shipment.booked") {
    // Everything quoted carries the forwarder's margin by construction — it is
    // priced buy + margin. Calling any of it a pass-through disbursement would
    // make the audit fire on the platform's own arithmetic.
    q.lines.forEach((l) => {
      const code = CODES[l.code] ? l.code : (l.code === "THC-D" ? "THC" : "FRT");
      S.charges.push(ch(code, {
        kind: code === "FRT" ? "FREIGHT" : "SURCHARGE",
        desc: l.desc, qty: l.quantity || 1,
        unit: roundHalfUp(l.sellZar / (l.quantity || 1)), buy: l.buyZar,
        prov: "MARKED_UP", on: "shipment.booked", vendor: q.card.carrier,
      }));
    });

    // The origin agent's own invoice. Billed at the terminal's published rate
    // rather than the rate in the agency agreement — the single commonest
    // handling-charge error in the trade, and small enough per container that
    // nobody queries it. Act 8 does.
    S.charges.push(ch("OHC", {
      qty: q.qty || 1, unit: 215000, buy: 215000 * (q.qty || 1), contract: 185000,
      on: "shipment.booked", desc: "Origin terminal handling", vendor: "Origin agent",
    }));

    // The carrier's bunker surcharge. Nothing on this platform can check it
    // until a fuel index is licensed, and the audit says so rather than
    // passing it.
    S.charges.push(ch("BAF", {
      qty: q.qty || 1, unit: 420000, buy: 420000 * (q.qty || 1),
      on: "shipment.booked", desc: "Bunker adjustment factor", vendor: q.card.carrier,
    }));

    // Charged per bill of lading, not per container. This one is billed twice.
    S.charges.push(ch("DOC", {
      kind: "FEE", qty: 2, unit: 85000, on: "shipment.booked",
      desc: "Documentation fee",
    }));
  }
  if (m.type === "vessel.departed" && S.persona?.type === "PARTNER_AGENT") {
    const freight = q.lines.find((l) => l.code === "FRT");
    const fee = roundHalfUp(freight.sellZar * 500 / 10000);
    S.charges.push(ch("PLF", {
      kind: "FEE", desc: "Platform fee (5% of freight sell)", qty: 1, unit: fee,
      buy: 0, on: "vessel.departed",
    }));
    S.feeCents += fee;
  }
  if (m.type === "container.gated_out") {
    // Four days of demurrage from the terminal. The gate clock says two are
    // chargeable; nobody can tell without the terminal feed.
    S.charges.push(ch("DEM", {
      kind: "DISBURSEMENT", qty: 4, unit: 95000, buy: 380000,
      desc: "Demurrage, Durban Container Terminal", on: "container.gated_out",
      vendor: "Transnet Port Terminals",
    }));
  }
  if (m.type === "entry.released") {
    S.charges.push(ch("DTY", {
      kind: "DISBURSEMENT", qty: 1, unit: customsTotals().total, buy: customsTotals().total,
      desc: "Duty & VAT disbursed to SARS", on: "entry.released", vendor: "SARS",
    }));
    S.charges.push(ch("CCL", {
      kind: "FEE", qty: 1, unit: 125000, buy: 45000, desc: "Clearing fee", on: "entry.released",
    }));
  }
}

/* ------------------------------------------------------- the document */
const lineVat = (sell, bps) => roundHalfUp(Math.abs(sell) * bps / 10000) * (sell < 0 ? -1 : 1);

function invoiceDoc() {
  const lines = S.charges.filter((c) => c.kind !== "FEE" || c.code !== "PLF");
  const sections = CAT_ORDER
    .map((cat) => ({ cat, label: CAT_LABEL[cat], lines: lines.filter((l) => l.cat === cat) }))
    .filter((s) => s.lines.length)
    .map((s) => ({
      ...s,
      sub: s.lines.reduce((a, l) => a + l.sell, 0),
      vat: s.lines.reduce((a, l) => a + lineVat(l.sell, l.vatBps), 0),
    }));
  const sub = sections.reduce((a, s) => a + s.sub, 0);
  const vat = sections.reduce((a, s) => a + s.vat, 0);
  const by = (p) => lines.filter((l) => l.prov === p).reduce((a, l) => a + l.sell, 0);
  return {
    sections, sub, vat, total: sub + vat,
    pass: by("PASS_THROUGH"), marked: by("MARKED_UP"), own: by("FORWARDER_ORIGINATED"),
  };
}

/* ================================================================= act 8 */
/* The four-way match. Every rule below is one that a two-way match against the
   quote total structurally cannot see. */
const MATCH_SOURCES = [
  { k: "CONTRACT", label: "Contract", sub: "The accepted quote's own lines" },
  { k: "VENDOR_COST", label: "Vendor cost", sub: "Recorded buy, or a published index" },
  { k: "SHIPMENT_DATA", label: "Shipment data", sub: "Containers, documents, weights" },
  { k: "SERVICE_EVENTS", label: "Service events", sub: "Did the billed thing happen" },
];

function runAudit() {
  const f = [];
  // From the booking, not a constant — the whole point of matching against
  // shipment data is that it is the shipment's data.
  const containers = S.quote ? S.quote.qty : 1;
  const documents = 1;
  const seen = S.events.map((e) => e.type);

  for (const l of S.charges) {
    if (l.basis === "container" && l.qty !== containers) {
      f.push({ sev: "WARN", code: "QUANTITY_VS_CONTAINERS", var: l.unit * (l.qty - containers),
        msg: `${l.desc} is charged per container at quantity ${l.qty}, but this shipment moves ${containers} containers.`,
        src: "SHIPMENT_DATA" });
    }
    if (l.basis === "document" && l.qty > documents) {
      f.push({ sev: "WARN", code: "QUANTITY_VS_DOCUMENTS", var: l.unit * (l.qty - documents),
        msg: `${l.desc} is charged for ${l.qty} documents; this shipment has ${documents}. Documentation fees are per bill of lading, not per container.`,
        src: "SHIPMENT_DATA" });
    }
    if (l.contract != null && l.unit !== l.contract) {
      f.push({ sev: l.unit > l.contract ? "CRITICAL" : "WARN", code: "CONTRACT_RATE_VARIANCE",
        var: (l.unit - l.contract) * l.qty,
        msg: `${l.desc} is billed at ${money(l.unit, "ZAR")} per ${l.basis} against a contracted ${money(l.contract, "ZAR")} (${(((l.unit - l.contract) / l.contract) * 100).toFixed(1)}%). Source: agency agreement, effective this quarter.`,
        src: "CONTRACT" });
    }
    if (l.prov === "PASS_THROUGH" && l.buy != null && l.sell > l.buy) {
      f.push({ sev: "CRITICAL", code: "MARGIN_ON_PASS_THROUGH", var: l.sell - l.buy,
        msg: `${l.desc} is billed as a disbursement but carries ${money(l.sell - l.buy, "ZAR")} above the recorded cost. Either the margin is wrong or the line is mislabelled.`,
        src: "VENDOR_COST" });
    }
    if (!(CODES[l.code] || CODES.MSC).tax && l.vatBps > 0) {
      f.push({ sev: "CRITICAL", code: "VAT_ON_DISBURSEMENT", var: lineVat(l.sell, l.vatBps),
        msg: `${l.desc} is outside the scope of VAT but is charged at ${(l.vatBps / 100).toFixed(0)}%. This overstates the invoice and the issuer's own VAT return together.`,
        src: "CONTRACT" });
    }
    if (l.code === "DEM" && !seen.includes("container.discharged")) {
      f.push({ sev: "CRITICAL", code: "SERVICE_NOT_EVIDENCED", var: l.sell,
        msg: `${l.desc} bills for time after discharge, but no discharge has been recorded on this shipment.`,
        src: "SERVICE_EVENTS" });
    }
  }

  if (S.charges.some((l) => l.cat === "FUEL_SURCHARGE")) {
    const t = S.charges.filter((l) => l.cat === "FUEL_SURCHARGE").reduce((a, l) => a + l.sell, 0);
    f.push({ sev: "WARN", code: "FUEL_BENCHMARK_UNAVAILABLE", var: null,
      msg: `${money(t, "ZAR")} of fuel surcharge could not be validated: no fuel index is configured. Bunker and jet-fuel indices are licensed external feeds — FUEL_INDEX_URL enables this check.`,
      src: null });
  }
  if (S.charges.some((l) => l.code === "DEM")) {
    f.push({ sev: "WARN", code: "DEMURRAGE_UNVERIFIABLE", var: null,
      msg: "Demurrage cannot be recomputed: it needs the discharge and gate-out timestamps from the terminal and the free-time allowance on the bill of lading. TERMINAL_EVENTS_URL enables this check.",
      src: null });
  }

  const order = { CRITICAL: 0, WARN: 1, INFO: 2 };
  f.sort((a, b) => order[a.sev] - order[b.sev] || Math.abs(b.var || 0) - Math.abs(a.var || 0));

  const depth = {
    CONTRACT: !!S.quote,
    VENDOR_COST: S.charges.some((l) => l.buy != null),
    SHIPMENT_DATA: !!S.booked,
    SERVICE_EVENTS: seen.length > 0,
  };
  return { findings: f, depth, matched: Object.values(depth).filter(Boolean).length };
}

function renderAudit() {
  if (!S.charges.length && S.booked) accrueFor(LIFECYCLE[0], S.quote || priceQuote());
  const a = S.audit;

  $("#audit-sources").innerHTML = MATCH_SOURCES.map((m) => {
    const on = a ? a.depth[m.k] : false;
    return `<div class="tile ${a ? (on ? "good" : "") : ""}">
      <div class="k">${m.label}</div>
      <div class="v" style="font-size:14px">${a ? (on ? "Matched" : "No data") : "—"}</div>
      <div class="s">${m.sub}</div></div>`;
  }).join("");

  const box = $("#audit-findings");
  if (!a) {
    box.innerHTML = `<p class="small muted" style="padding:14px 0">
      Not matched yet. Run it <b>before</b> the invoice is paid — carriers and forwarders run
      dispute windows measured in days, and a finding raised at month-end is a finding raised after
      the window closed.</p>`;
  } else {
    const queryable = a.findings.reduce((t, x) => t + Math.max(0, x.var || 0), 0);
    box.innerHTML =
      `<p class="small" style="margin:6px 0 12px">
         <b class="p">${a.findings.length} finding${a.findings.length === 1 ? "" : "s"}</b>
         <span class="muted"> across ${S.charges.length} lines, matched against
         ${a.matched} of 4 sources.</span>
         ${queryable ? `<span style="color:var(--warning)"> ${money(queryable, "ZAR")} queryable.</span>` : ""}</p>` +
      (a.matched < 4 ? `<div class="note" style="margin:0 0 11px">
         Matched against ${a.matched} of 4 sources. The lines that depend on the missing ones have
         not been validated, and are listed below rather than passed.</div>` : "") +
      a.findings.map((x) => `<div class="evt" style="display:block;padding:9px 0">
        <div class="row" style="gap:8px">
          <span class="tag ${x.sev === "CRITICAL" ? "bad" : "warn"}"><i></i>${x.sev}</span>
          <span class="mono muted" style="font-size:10.5px">${x.code}</span>
          ${x.var ? `<span class="tab" style="margin-left:auto;color:${x.var > 0 ? "var(--warning)" : "var(--t2)"};font-weight:600">
            ${x.var > 0 ? "+" : ""}${money(x.var, "ZAR")}</span>` : ""}
        </div>
        <p class="small" style="margin:5px 0 0;color:var(--t1)">${esc(x.msg)}</p></div>`).join("");
  }

  $("#audit-risk").innerHTML = ["BAF", "THC", "DOC", "DEM", "FRT"].map((c) => {
    const d = CODES[c] || CODES.MSC;
    const w = d.err === "HIGH" ? 100 : d.err === "MEDIUM" ? 55 : 18;
    return `<div style="margin-bottom:9px">
      <div class="row" style="justify-content:space-between;font-size:11.5px">
        <span><span class="mono muted">${c}</span> <span class="p">${d.label}</span></span>
        <span class="tag ${d.err === "HIGH" ? "bad" : d.err === "MEDIUM" ? "warn" : ""}">${d.err}</span></div>
      <div class="meter" style="margin-top:5px"><i style="width:${w}%"></i></div></div>`;
  }).join("");

  // 3,000 containers a year through one port, at the variances this one invoice
  // already shows. Nothing here is extrapolated from a number the demo invented.
  const boxes = S.quote ? S.quote.qty : 1;
  const perBox = (a ? a.findings.reduce((t, x) => t + Math.max(0, x.var || 0), 0) : 0) / boxes;
  $("#audit-portfolio").innerHTML = `
    <div class="kv"><span class="k">Queryable on this invoice</span><span class="v">${money(perBox * boxes, "ZAR")}</span></div>
    <div class="kv"><span class="k">Per container</span><span class="v">${money(perBox, "ZAR")}</span></div>
    <div class="kv tot"><span class="k">Across 3,000 containers a year</span>
      <span class="v accent">${money(perBox * 3000, "ZAR")}</span></div>
    <p class="small muted" style="margin:9px 0 0">
      One lane, one port, the findings from a single invoice. Every one of them is individually
      below a manual review threshold, which is exactly why they survive.</p>`;
}

$("#audit-run").addEventListener("click", () => {
  if (!S.charges.length && S.booked) accrueFor(LIFECYCLE[0], S.quote || priceQuote());
  S.audit = runAudit();
  emit("invoice.audited", {
    findings: S.audit.findings.length,
    matchedSources: `${S.audit.matched}/4`,
    queryable: money(S.audit.findings.reduce((t, x) => t + Math.max(0, x.var || 0), 0), "ZAR"),
  }, { src: "audit", minutes: 5 });
  renderAudit();
});

$("#audit-packet").addEventListener("click", () => {

  const lines = [

/* ================================================================= act 6 */
function dutyLine(l) {
  const duty = roundHalfUp(l.value * l.rate / 10000);
  const uplift = l.sacu ? 0 : roundHalfUp(l.value * ATV_UPLIFT_BPS / 10000);
  const atv = l.value + uplift + duty;
  const vat = roundHalfUp(atv * VAT_RATE_BPS / 10000);
  return { duty, uplift, atv, vat };
}
function customsTotals() {
  const t = CUSTOMS_LINES.reduce((a, l) => {
    const d = dutyLine(l);
    a.value += l.value; a.duty += d.duty; a.vat += d.vat; a.atv += d.atv;
    return a;
  }, { value: 0, duty: 0, vat: 0, atv: 0 });
  t.total = t.duty + t.vat;
  return t;
}

  $("#cust-totals").innerHTML = `

function renderMoney() {
  if (!S.charges.length && S.booked) accrueFor(LIFECYCLE[0], S.quote || priceQuote());

  $("#charge-tbl").innerHTML =
    `<thead><tr><th>Kind</th><th>Description</th><th>Accrued on</th><th class="r">Buy</th><th class="r">Sell</th></tr></thead><tbody>` +
    (S.charges.length ? S.charges.map((c) => `<tr>
      <td><span class="tag ${c.kind === "FEE" ? "rails" : ""}">${c.kind}</span></td>
      <td class="p">${esc(c.desc)}</td>
      <td class="mono" style="font-size:10.5px">${c.on}</td>
      <td class="r tab muted">${money(c.buy, c.ccy)}</td>
      <td class="r tab p">${money(c.sell, c.ccy)}</td></tr>`).join("")
      : `<tr><td colspan="5" class="center muted" style="padding:22px">Nothing accrued yet — book and move a shipment first.</td></tr>`) +
    `</tbody>`;

  $("#inv-issue").disabled = !S.charges.length || !!S.invoice;
  $("#inv-issue").textContent = S.invoice ? "Invoiced ✓" : "Issue invoice";

  const sellTotal = S.charges.reduce((s, c) => s + c.sell, 0);
  const buyTotal = S.charges.reduce((s, c) => s + c.buy, 0);
  const margin = sellTotal - buyTotal;
  // Duty and VAT are billed at cost and remitted to SARS. Including them in
  // the denominator makes the margin ratio meaningless — R800 on R495k reads
  // as a failing business when it is really R800 on R1,750 of actual service.
  const revenue = S.charges.filter((c) => c.kind !== "DISBURSEMENT").reduce((s, c) => s + c.sell, 0);
  $("#pnl").innerHTML = `
    <div class="kv"><span class="k">Sell (billed to customer)</span><span class="v">${money(sellTotal, "ZAR")}</span></div>
    <div class="kv"><span class="k">Buy (carriers, SARS, hauliers)</span><span class="v muted">${money(buyTotal, "ZAR")}</span></div>
    <div class="kv tot"><span class="k">Gross margin</span><span class="v accent">${money(margin, "ZAR")}</span></div>
    <div style="margin-top:11px" class="meter"><i style="width:${revenue ? Math.min(100, margin / revenue * 100).toFixed(1) : 0}%"></i></div>
    <p class="small muted" style="margin:7px 0 0">
      ${revenue ? (margin / revenue * 100).toFixed(1) : "0.0"}% margin on ${money(revenue, "ZAR")} of service revenue.
      Duty and VAT are billed at cost and remitted, so they are excluded.</p>`;

  const paid = S.payments.reduce((s, p) => s + p.amt, 0);
  if (S.invoice) {
    $("#inv-panel").hidden = false;
    $("#inv-num").textContent = S.invoice.number;
    const outstanding = S.invoice.total - paid;
    const status = paid >= S.invoice.total ? "PAID" : paid > 0 ? "PART_PAID" : "ISSUED";
    const tag = $("#inv-status");
    tag.className = "tag " + (status === "PAID" ? "good" : status === "PART_PAID" ? "warn" : "accent");
    tag.innerHTML = `<i></i>${status.replace("_", " ")}`;

    $("#pay-tbl").innerHTML =
      `<thead><tr><th>Reference</th><th>Received</th><th class="r">Amount</th></tr></thead><tbody>` +
      (S.payments.length ? S.payments.map((p) => `<tr class="${p.fresh ? "new-row" : ""}">
        <td class="mono p">${esc(p.ref)}</td><td>${p.when}</td>
        <td class="r tab p">${money(p.amt, "ZAR")}</td></tr>`).join("")
        : `<tr><td colspan="3" class="center muted" style="padding:16px">No payments recorded.</td></tr>`) +
      `<tr><td colspan="2" class="p">Invoice total</td><td class="r tab p">${money(S.invoice.total, "ZAR")}</td></tr>
       <tr><td colspan="2" class="p">Outstanding</td><td class="r tab ${outstanding > 0 ? "p" : "muted"}">${money(Math.max(outstanding, 0), "ZAR")}</td></tr></tbody>`;

    if (!$("#pay-amt").dataset.touched) $("#pay-amt").value = (Math.max(outstanding, 0) / 100).toFixed(2);
  }

  $("#finance-views").innerHTML = `
    <div class="kv"><span class="k">Duty outlay, financeable</span><span class="v">${money(S.customs.status === "RELEASED" ? customsTotals().total : 0, "ZAR")}</span></div>
    <div class="kv"><span class="k">Receivables on the factoring clock</span><span class="v">${money(S.invoice ? Math.max(S.invoice.total - paid, 0) : 0, "ZAR")}</span></div>
    <div class="kv"><span class="k">Ledger events emitted</span><span class="v">${S.events.filter((e) => /charge|invoice|payment|entry/.test(e.type)).length}</span></div>`;

  renderDoc();
}

$("#inv-issue").addEventListener("click", () => {
  if (S.invoice || !S.charges.length) return;
  const total = invoiceDoc().total;
  S.invoice = { number: `${ISSUER.prefix}-2026-000001`, total: invoiceDoc().total };
  emit("invoice.issued", { invoiceId: S.invoice.number, total: money(total, "ZAR"), terms: "30 days" }, { minutes: 60 });
  $("#pay-amt").dataset.touched = "";
  renderMoney();
});

$("#pay-amt").addEventListener("input", () => ($("#pay-amt").dataset.touched = "1"));

$("#pay-btn").addEventListener("click", () => {
  const msg = $("#pay-msg");
  if (!S.invoice) return;
  const ref = $("#pay-ref").value.trim();
  const amt = Math.round(Number($("#pay-amt").value || 0) * 100);
  if (!ref) {
    msg.style.color = "var(--critical)";
    msg.textContent = "A payment reference is required — it is what prevents double-crediting.";
    return;
  }
  if (amt <= 0) {
    msg.style.color = "var(--critical)";
    msg.textContent = "Enter the amount received.";
    return;
  }
  if (S.payments.some((p) => p.ref === ref)) {
    msg.style.color = "var(--warning)";
    msg.textContent = `Reference ${ref} was already applied to this invoice — nothing changed, and no second event was emitted.`;
    renderMoney();
    return;
  }
  S.payments.forEach((p) => (p.fresh = false));
  S.payments.push({ ref, amt, when: dayStamp(S.clock), fresh: true });
  emit("payment.received", { invoiceId: S.invoice.number, amount: money(amt, "ZAR"), paymentRef: ref }, { minutes: 90 });
  const paid = S.payments.reduce((s, p) => s + p.amt, 0);
  const out = S.invoice.total - paid;
  msg.style.color = out > 0 ? "var(--t2)" : "var(--success)";
  msg.textContent = out > 0
    ? `Recorded. ${money(out, "ZAR")} still outstanding.`
    : out < 0 ? `Recorded — overpaid by ${money(-out, "ZAR")}, which is money to refund, not revenue.`
    : "Recorded. Invoice settled in full.";
  $("#pay-amt").dataset.touched = "";
  renderMoney();
});

    { k: "Shipment status", v: shipmentStatus() ? shipmentStatus().replace(/_/g, " ") : "—" },
    { k: "Freight margin", v: money(m1, "ZAR"), cls: "accent" },
    { k: "Platform fees", v: money(feeRun, "ZAR"), cls: "rails" },
  ].map((t) => `<div class="tile ${t.cls || ""}"><div class="k">${t.k}</div><div class="v" style="font-size:${String(t.v).length > 9 ? 17 : 22}px">${t.v}</div></div>`).join("");
}

/* ================================================================ wiring */
const RENDER = {
  0: renderPersonas,
  1: renderDash,
  2: renderRates,
  3: renderQuote,
  4: renderBook,
  5: renderTrack,
  6: renderCustoms,
  7: renderMoney,
  8: renderAudit,
  9: renderCompliance,
  10: renderPortal,
  11: renderNetwork,
  12: renderArch,
  13: renderClose,
};

$("#next-btn").addEventListener("click", () => go(S.act + 1));
$("#prev-btn").addEventListener("click", () => go(S.act - 1));

document.addEventListener("keydown", (e) => {
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(S.act + 1);
  if (e.key === "ArrowLeft") go(S.act - 1);
});

/* Theme toggle mirrors the console's own. */
const themeBtn = $("#theme-btn");
function syncThemeLabel() {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : !window.matchMedia("(prefers-color-scheme: light)").matches;
  themeBtn.textContent = dark ? "Light" : "Dark";
}
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme
    || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  syncThemeLabel();
  RENDER[S.act] && RENDER[S.act]();
});
syncThemeLabel();

renderRail();
go(0);
</script>
