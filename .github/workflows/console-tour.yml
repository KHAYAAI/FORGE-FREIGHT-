name: Regenerate console tour

on:
  workflow_dispatch:
  push:
    branches: [claude/freight-forwarding-oss-stack-0uc9mf]
    # The workflow itself is in the trigger set: a change to how the tour is
    # recorded or released should re-record and re-release it.
    paths:
      - console/**
      - .github/workflows/console-tour.yml

jobs:
  tour:
    runs-on: ubuntu-latest
    # Creating the release needs write access to repository contents. The
    # default GITHUB_TOKEN is read-only, which is why the upload step failed
    # in 0s while every step before it succeeded.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          mkdir -p "$HOME/pw-tour"
          cd "$HOME/pw-tour"
          npm init -y >/dev/null
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Record tour
        run: node tour.mjs
        working-directory: console
        env:
          TOUR_OUT: tour-out
          PLAYWRIGHT_MODULE: /home/runner/pw-tour/node_modules/playwright/index.mjs

      - name: Encode MP4
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -y -i console/tour-out/forge-freight-console-tour.webm \
            -c:v libx264 -preset veryslow -crf 27 -r 15 -pix_fmt yuv420p \
            -movflags +faststart -an console/tour-out/forge-freight-console-tour.mp4

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: console/tour-out/forge-freight-console-tour.mp4
          tag_name: console-tour-latest
          prerelease: true
          body: |
            Automated console tour recording.
            Duration: ~8.5 minutes
            Chapters: 14 (price → book → move → clear → invoice → match → query → pay)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
