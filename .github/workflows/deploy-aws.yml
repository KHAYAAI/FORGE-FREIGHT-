name: Deploy to AWS

# Manual trigger only, deliberately — this pushes to production ECS. Wire
# `on: push: branches: [main]` back in once you trust the pipeline end to
# end; until then, deploy is a deliberate action, not a side effect of merge.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match a terraform.tfvars environment name)
        required: true
        default: production

permissions:
  id-token: write # OIDC federation to AWS — no long-lived access keys in this repo
  contents: read

env:
  AWS_REGION: af-south-1
  ECR_REPO_PREFIX: forge-freight-production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}/api:${{ steps.tag.outputs.image_tag }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}/worker:${{ steps.tag.outputs.image_tag }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}/web:${{ steps.tag.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform apply (image_tag only)
        working-directory: infra/aws
        run: |
          terraform init
          terraform apply -auto-approve \
            -var "image_tag=${{ needs.build-and-push.outputs.image_tag }}"

      - name: Wait for ECS services to stabilize
        run: |
          for svc in api worker web; do
            aws ecs wait services-stable \
              --cluster forge-freight-production \
              --services "forge-freight-production-${svc}"
          done
