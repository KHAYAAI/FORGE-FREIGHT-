name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly-published query packs against unchanged code — a real
    # finding can appear with no diff on this repo's side.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
