# n8n for local development.
#
# n8n is the loading dock: it faces the outside world, sorts the mess, and
# hands the Freight Core clean, structured requests. It is NOT the system of
# record and NOT the shipment state machine.
#
# The hard rules, enforced by what it is given rather than by policy:
#   - no Freight Core database credentials are present in this file, so n8n
#     cannot write to PostgreSQL even if a workflow tried;
#   - its only route in is an authenticated API key on the Freight Core API;
#   - its own Postgres holds workflow definitions and execution history, and
#     nothing about freight.
#
#   cd infrastructure/n8n
#   cp .env.example .env      # then fill in the API key
#   docker compose up -d
#   open http://localhost:5678

name: forge-n8n

services:
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_ADMIN_USER:-admin@forgefreight.local}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_ADMIN_PASSWORD:?set N8N_ADMIN_PASSWORD in .env}

      # Encrypts stored credentials at rest. Changing it orphans every saved
      # credential, so keep it stable per environment and out of git.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}

      GENERIC_TIMEZONE: ${TZ:-Africa/Johannesburg}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Executions are the audit trail for anything that touched a customer.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_MAX_AGE: "720" # hours; 30 days
      N8N_LOG_LEVEL: info

      # Read by workflows as {{ $env.FREIGHT_API_URL }} / FREIGHT_INGEST_API_KEY.
      FREIGHT_API_URL: ${FREIGHT_API_URL:-http://host.docker.internal:3000}
      FREIGHT_INGEST_API_KEY: ${FREIGHT_INGEST_API_KEY:?set FREIGHT_INGEST_API_KEY in .env}
      FREIGHT_TENANT_ID: ${FREIGHT_TENANT_ID:?set FREIGHT_TENANT_ID in .env}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
      # Workflow JSON lives in git and is imported, not authored in the UI.
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  n8n-db:
  n8n-data:
