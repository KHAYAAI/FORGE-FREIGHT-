function createQuote(S, tenantId, input) {
  const result = buildQuote(S, { ...input, tenantId });
  const q = {
    id: uid(S, "q"), tenantId, customerId: input.customerId, status: "ISSUED",
    origin: input.origin, destination: input.destination, mode: input.mode,
    containerType: input.containerType, containerQuantity: input.containerQuantity,
    incoterm: input.incoterm, consignmentId: input.consignment ? input.consignment.id : null,
    rateCardId: result.card.id, marginRuleId: result.rule.id,
    lines: result.lines, totalZar: result.totalZar, buyZar: result.buyZar,
    transitDays: result.transitDays, carrier: result.card.carrier,
    validUntil: S.now + 14 * DAY, createdAt: S.now,
  };
  S.quotes.push(q);
  emit(S, { type: "quote.issued", tenantId, payload: {
    quoteId: q.id, lane: `${q.origin}→${q.destination}`, total: money(q.totalZar, "ZAR"),
    carrier: q.carrier, marginRule: result.rule.id } });
  return q;
}

/* -------------------------------------------------------------- booking -- */

let REF_SEQ = 40;

function bookQuote(S, quoteId, carrierBookingRef) {
  const q = S.quotes.find((x) => x.id === quoteId);
  if (!q) throw new Error("Quote not found");
  if (q.status === "ACCEPTED") { const e = new Error("This quote has already been booked."); e.kind = "CONFLICT"; throw e; }
  if (S.now > q.validUntil) { const e = new Error("This quote has expired — reprice it before booking."); e.kind = "EXPIRED"; throw e; }

  q.status = "ACCEPTED";
  const ref = `FF-2026-${String(++REF_SEQ).padStart(5, "0")}`;
  const cons = S.consignments.find((c) => c.id === q.consignmentId);

  const s = {
    id: uid(S, "sh"), tenantId: q.tenantId, quoteId: q.id, customerId: q.customerId,
    reference: ref, status: "BOOKED", origin: q.origin, destination: q.destination,
    mode: q.mode, incoterm: q.incoterm, consignmentId: q.consignmentId,
    carrierBookingRef: carrierBookingRef || null, carrier: q.carrier,
    blNumber: null, vesselName: null, voyage: null,
    containers: Array.from({ length: q.containerQuantity }, (_, i) => ({
      id: uid(S, "ct"), number: null, type: q.containerType })),
    step: 0, freeTimeDays: 5,
    dischargedAt: null, gateOutAt: null, emptyReturnedAt: null,
    etd: S.now + 6 * DAY, eta: S.now + 6 * DAY + (q.transitDays || 21) * DAY,
    createdAt: S.now,
  };
  S.shipments.push(s);

  emit(S, { type: "quote.accepted", tenantId: s.tenantId, shipmentId: s.id, payload: { quoteId: q.id } });
  emit(S, { type: "shipment.booked", tenantId: s.tenantId, shipmentId: s.id, payload: {
    reference: ref, lane: `${s.origin}→${s.destination}`, carrierBookingRef: s.carrierBookingRef } });
  accrueFor(S, s, "shipment.booked");
  return s;
}

/* ------------------------------------------------------------ lifecycle -- */

function advance(S, shipmentId, hours = 14) {
  const s = S.shipments.find((x) => x.id === shipmentId);
  if (!s || s.step >= LIFECYCLE.length - 1) return null;
  s.step += 1;
  const m = LIFECYCLE[s.step];
  S.now += hours * 3600000;
  s.status = m.status;

  if (m.type === "container.loaded") {
    s.containers.forEach((c, i) => { if (!c.number) c.number = containerNumber(S, i); });
    s.blNumber = s.blNumber || blNumber(S, s);
  }
  if (m.type === "container.discharged") s.dischargedAt = S.now;
  if (m.type === "container.gated_out") s.gateOutAt = S.now;
  if (m.type === "pod.confirmed") s.emptyReturnedAt = S.now + 2 * DAY;

  emit(S, { type: m.type, tenantId: s.tenantId, shipmentId: s.id, src: m.src, payload: {
    status: m.status, ...(s.blNumber ? { blNumber: s.blNumber } : {}) } });

  if (m.type === "entry.submitted") { const e = entryFor(S, s); if (e) e.status = "SUBMITTED"; }
  if (m.type === "entry.released") { const e = entryFor(S, s); if (e) e.status = "RELEASED"; }
  accrueFor(S, s, m.type);
  return m;
}

/* ISO 6346 — four letters then seven digits, with the check digit that makes a
   terminal accept it. Generated rather than faked because the number appears
   on the bill of lading and on the invoice, and a malformed one is the sort of
   detail somebody in the room will check. */
function containerNumber(S, i) {
  const owner = "MAEU";
  const serial = String(2411800 + S.seq * 7 + i * 13).slice(0, 6);
  const body = owner + "U" + serial;
  const VAL = { A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,
    O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38 };
  let sum = 0;
  for (let k = 0; k < 10; k++) {
    const ch = body[k];
    sum += (VAL[ch] != null ? VAL[ch] : Number(ch)) * Math.pow(2, k);
  }
  return `${owner}${serial}${sum % 11 % 10}`;
}
const blNumber = (S, s) => `${s.carrier === "Maersk Line" ? "MAEU" : "CMDU"}${240000000 + S.seq * 137}`;

/* --------------------------------------------------------------- charges */

/* What the billing consumer writes when an event lands. The taxonomy comes
   from the code itself: left on defaults, an automatically-accrued line claims
   to be an uncategorised charge the forwarder originated with no cost behind
   it — the exact shape the audit is built to pass. */
function pushCharge(S, s, code, o) {
  const def = CODE[code] || CODE.MSC;
  const qty = o.qty ?? 1;
  const ch = {
    id: uid(S, "ch"), tenantId: s.tenantId, shipmentId: s.id,
    code, description: o.description || def.label,
    kind: o.kind || def.kind, cat: def.cat, prov: o.prov || def.prov,
    basis: o.basis || def.basis, qty,
    unitSellCents: o.unitCents, sellCents: o.unitCents * qty,
    buyCents: o.buyCents ?? null, contractRef: o.contractRef || null,
    vendorName: o.vendorName || null, vendorInvoiceRef: o.vendorInvoiceRef || null,
    currency: o.currency || "ZAR", vatBps: def.tax ? (S.billingProfiles[s.tenantId]?.vatBps ?? 0) : 0,
    triggeredBy: o.on, invoiceId: null, disputed: false, match: "exact",
    createdAt: S.now,
  };
  S.charges.push(ch);
  emit(S, { type: "charge.accrued", tenantId: s.tenantId, shipmentId: s.id, src: "billing-accrual",
    payload: { chargeId: ch.id, code, sell: money(ch.sellCents, ch.currency), triggeredBy: o.on } });
  return ch;
}

function accrueFor(S, s, eventType) {
  /* Idempotent on the triggering event, exactly like the real consumer: the
     same milestone arriving twice from two carrier feeds must not bill twice. */
  if (S.charges.some((c) => c.shipmentId === s.id && c.triggeredBy === eventType)) return;
  const q = S.quotes.find((x) => x.id === s.quoteId);
  const boxes = s.containers.length;

  if (eventType === "shipment.booked" && q) {
    for (const l of q.lines) {
      const n = normaliseCode(l.code, aliasMap(S, s.tenantId));
      /* Everything on the quote is priced buy + margin by construction, so it
         is MARKED_UP whatever the code's default says. Calling a quoted
         surcharge a pass-through disbursement makes the audit fire on the
         platform's own arithmetic — which it did, until this line. */
      pushCharge(S, s, n.code, {
        description: l.description, qty: l.quantity, basis: l.basis,
        unitCents: roundHalfUp(l.sellZar / l.quantity), buyCents: l.buyZar,
        prov: l.buyCents > 0 ? "MARKED_UP" : "FORWARDER_ORIGINATED",
        vendorName: s.carrier, contractRef: `Quote ${q.id}`, on: eventType,
      });
    }
    /* The origin agent's own invoice, which arrives separately from the
       carrier's and is where handling errors live. */
    pushCharge(S, s, "OHC", { qty: boxes, unitCents: 215000, buyCents: 215000 * boxes,
      description: `Origin terminal handling, ${PORTS[s.origin] || s.origin}`,
      vendorName: "Shanghai Port Agency", vendorInvoiceRef: `SIPG-2026-${88100 + S.seq}`, on: eventType });
    pushCharge(S, s, "DOC", { qty: 1, unitCents: 85000, description: "Documentation fee", on: eventType });
  }

  if (eventType === "vessel.departed") {
    const t = S.tenants.find((x) => x.id === s.tenantId);
    if (t.type === "PARTNER_AGENT" && t.platformFeeBps) {
      const freight = S.charges.filter((c) => c.shipmentId === s.id && c.code === "FRT")
        .reduce((a, c) => a + c.sellCents, 0);
      const fee = roundHalfUp(freight * t.platformFeeBps / 10000);
      if (fee > 0) pushCharge(S, s, "PLF", { qty: 1, unitCents: fee, buyCents: 0,
        description: `Platform fee (${pct(t.platformFeeBps)} of freight)`, on: eventType });
    }
  }

  if (eventType === "entry.released") {
    const e = entryFor(S, s);
    const totals = e ? entryTotals(e) : { total: 0 };
    if (totals.total > 0) pushCharge(S, s, "DTY", { qty: 1, unitCents: totals.total,
      buyCents: totals.total, description: "Customs duty and VAT disbursed to SARS",
      vendorName: "South African Revenue Service", vendorInvoiceRef: e ? e.reference : null, on: eventType });
    pushCharge(S, s, "CCL", { qty: 1, unitCents: 195000, buyCents: 45000,
      description: "Customs clearance", on: eventType });
  }

  if (eventType === "container.gated_out") {
    const dwell = s.dischargedAt ? Math.ceil((S.now - s.dischargedAt) / DAY) : 0;
    const days = Math.max(0, dwell - s.freeTimeDays);
    if (days > 0) pushCharge(S, s, "DEM", { qty: days, unitCents: 95000, buyCents: 95000 * days,
      description: `Demurrage, ${PORTS[s.destination] || s.destination} container terminal`,
      vendorName: "Transnet Port Terminals", vendorInvoiceRef: `TPT-DEM-${9900 + S.seq}`, on: eventType });
    pushCharge(S, s, "DEL", { qty: s.containers.length, unitCents: 148000, buyCents: 112000 * s.containers.length,
      description: `Delivery, ${PORTS[s.destination] || s.destination} to consignee`,
      vendorName: "N3 Corridor Logistics", on: eventType });
  }
}

const aliasMap = (S, tenantId) =>
  new Map(S.aliases.filter((a) => a.tenantId === tenantId).map((a) => [normKey(a.alias), a.canonical]));

/* -------------------------------------------------------------- customs -- */

const TARIFF = [
  { hs: "6109.10", desc: "T-shirts, singlets, knitted, of cotton", rateBps: 4500, kw: "shirt cotton knit apparel tee" },
  { hs: "6203.42", desc: "Men's trousers, of cotton", rateBps: 4000, kw: "trousers pants cotton mens" },
  { hs: "8471.30", desc: "Portable data-processing machines, ≤10 kg", rateBps: 0, kw: "laptop notebook computer portable" },
  { hs: "8544.42", desc: "Electric conductors, fitted with connectors", rateBps: 1500, kw: "cable wire connector electric" },
  { hs: "0805.10", desc: "Oranges, fresh or dried", rateBps: 0, kw: "orange citrus fruit fresh" },
  { hs: "0806.10", desc: "Grapes, fresh", rateBps: 0, kw: "grape fruit fresh table" },
  { hs: "8408.20", desc: "Compression-ignition engines for vehicles", rateBps: 2000, kw: "engine diesel motor vehicle" },
  { hs: "7326.90", desc: "Other articles of iron or steel", rateBps: 1000, kw: "steel iron bracket fabricated part" },
  { hs: "3926.90", desc: "Other articles of plastics", rateBps: 2000, kw: "plastic moulded component article" },
  { hs: "8703.23", desc: "Motor cars, spark-ignition, 1500–3000 cc", rateBps: 2500, kw: "car vehicle motor passenger" },
  { hs: "9403.60", desc: "Other wooden furniture", rateBps: 2000, kw: "furniture wooden table chair" },
  { hs: "2204.21", desc: "Wine of fresh grapes, ≤2 litre containers", rateBps: 2500, kw: "wine bottle grape alcohol" },
];

function classify(query) {
  const q = String(query || "").toLowerCase().split(/\s+/).filter(Boolean);
  if (!q.length) return [];
  return TARIFF.map((t) => {
    const hay = (t.desc + " " + t.kw).toLowerCase();
    const hits = q.filter((w) => hay.includes(w)).length;
    return { ...t, confidence: hits / q.length };
  }).filter((t) => t.confidence > 0)
    .sort((a, b) => b.confidence - a.confidence)
    .slice(0, 5);
}

const entryFor = (S, s) => S.entries.find((e) => e.shipmentId === s.id);

function createEntry(S, shipmentId, lines) {
  const s = S.shipments.find((x) => x.id === shipmentId);
  const e = {
    id: uid(S, "en"), tenantId: s.tenantId, shipmentId,
    reference: `CUS-2026-${String(4100 + S.entries.length).padStart(5, "0")}`,
    status: "DRAFT", lines: lines.map((l) => ({ ...l, id: uid(S, "el"), confirmed: !!l.hsCode })),
    createdAt: S.now,
  };
  S.entries.push(e);
  emit(S, { type: "entry.prepared", tenantId: s.tenantId, shipmentId, payload: {
    entryId: e.id, reference: e.reference, lines: e.lines.length } });
  return e;
}

/* -------------------------------------------------------------- billing -- */

/* The issuing company's own gapless series, consumed atomically. Several
   jurisdictions require an issuer's numbering to be sequential with no gaps,
   and a shared sequence hands company B the numbers company A did not use. */
function nextInvoiceNumber(S, tenantId) {
  const p = S.billingProfiles[tenantId];
  const n = p.nextInvoiceNumber++;
  return `${p.invoiceNumberPrefix}-${new Date(S.now).getUTCFullYear()}-${String(n).padStart(6, "0")}`;
}

function profileCompleteness(p) {
  const missing = [];
  if (!p.registrationNumber) missing.push("Company registration number");
  if (!p.vatNumber) missing.push("VAT registration number");
  if (!p.addressLines) missing.push("Registered address");
  if (!p.bankAccountNumber || !p.bankName) missing.push("Bank account for payment");
  if (!p.customsClientNumber) missing.push("Customs client number (needed to lodge declarations)");
  return { ready: missing.length === 0, missing };
}

function issueInvoice(S, shipmentId, opts = {}) {
  const s = S.shipments.find((x) => x.id === shipmentId);
  const unbilled = S.charges.filter((c) => c.shipmentId === shipmentId && !c.invoiceId);
  if (!unbilled.length) { const e = new Error("No uninvoiced charges on this shipment."); e.kind = "CONFLICT"; throw e; }

  const p = S.billingProfiles[s.tenantId];
  const cust = S.parties.find((x) => x.id === s.customerId);
  const terms = opts.paymentTermsDays ?? p.defaultPaymentTermsDays;

  const byCcy = new Map();
  for (const c of unbilled) byCcy.set(c.currency, [...(byCcy.get(c.currency) || []), c]);

  const issued = [];
  for (const [currency, group] of byCcy) {
    const sub = group.reduce((a, c) => a + c.sellCents, 0);
    const vat = group.reduce((a, c) => a + lineVat(c.sellCents, c.vatBps), 0);
    const inv = {
      id: uid(S, "inv"), tenantId: s.tenantId, shipmentId, customerId: s.customerId,
      number: nextInvoiceNumber(S, s.tenantId), type: "FREIGHT_INVOICE", status: "ISSUED",
      subtotalCents: sub, vatCents: vat, totalCents: sub + vat,
      disbursementCents: group.filter((c) => c.prov === "PASS_THROUGH").reduce((a, c) => a + c.sellCents, 0),
      currency, paymentTermsDays: terms, dueDate: S.now + terms * DAY,
      blNumber: opts.blNumber ?? s.blNumber, customerReference: opts.customerReference || null,
      /* Snapshotted, not joined: a company that changes its bank account
         tomorrow must not change what today's invoice says. */
      issuer: { ...p }, billTo: cust ? {
        name: cust.name, addressLines: cust.address, country: cust.country,
        taxId: cust.taxId, email: cust.email } : { name: "Customer" },
      auditedAt: null, createdAt: S.now,
    };
    group.forEach((c) => { c.invoiceId = inv.id; });
    S.invoices.push(inv);
    emit(S, { type: "invoice.issued", tenantId: s.tenantId, shipmentId, payload: {
      invoiceId: inv.id, number: inv.number, total: money(inv.totalCents, currency),
      dueDate: new Date(inv.dueDate).toISOString().slice(0, 10) } });
    issued.push(inv);
  }
  return issued;
}

/* Settlement is decided by the running total, not by this one payment: two
   half payments used to leave an invoice PART_PAID forever. A part payment
   does not cure lateness, or an overdue invoice would drop off the list the
   moment a customer paid a token amount. */
function recordPayment(S, invoiceId, { amountCents, paymentRef, receivedAt }) {
  const inv = S.invoices.find((x) => x.id === invoiceId);
  if (!inv) throw new Error("Invoice not found");
  if (inv.status === "CANCELLED") { const e = new Error(`${inv.number} is cancelled and cannot be paid.`); e.kind = "CONFLICT"; throw e; }

  /* The reference is the bank's, and banks redeliver. Unique per invoice, so a
     replayed webhook is a no-op rather than a second credit — and it emits
     nothing, because a second payment.received would reach the ledger sink and
     the customer's notifications as though money had arrived twice. */
  if (S.payments.some((p) => p.invoiceId === invoiceId && p.paymentRef === paymentRef)) {
    const paid = paidOn(S, invoiceId);
    return { duplicate: true, paidCents: paid, outstandingCents: inv.totalCents - paid, status: inv.status };
  }

  S.payments.push({ id: uid(S, "pay"), tenantId: inv.tenantId, invoiceId,
    amountCents, currency: inv.currency, paymentRef, receivedAt: receivedAt || S.now, fresh: true });

  const paid = paidOn(S, invoiceId);
  const outstanding = inv.totalCents - paid;
  const late = inv.dueDate < S.now;
  inv.status = paid >= inv.totalCents ? "PAID" : paid > 0 ? (late ? "OVERDUE" : "PART_PAID") : inv.status;

  emit(S, { type: "payment.received", tenantId: inv.tenantId, shipmentId: inv.shipmentId, src: "ForgePay",
    payload: { invoiceId, amount: money(amountCents, inv.currency), paymentRef } });

  return { duplicate: false, paidCents: paid, outstandingCents: outstanding,
    overpaidCents: outstanding < 0 ? -outstanding : 0, status: inv.status };
}

const paidOn = (S, invoiceId) =>
  S.payments.filter((p) => p.invoiceId === invoiceId).reduce((a, p) => a + p.amountCents, 0);

/* The hourly sweep. The status existed in the enum and the console rendered it
   as a red badge with its own filter, but nothing ever set it — so the overdue
   count was permanently zero and the screen quietly lied. */
function markOverdue(S) {
  let n = 0;
  for (const inv of S.invoices) {
    if (["ISSUED", "PART_PAID"].includes(inv.status) && inv.dueDate < S.now) { inv.status = "OVERDUE"; n++; }
  }
  return n;
}

/* ---------------------------------------------------------------- audit -- */

function invoiceLines(S, invoiceId) {
  return S.charges.filter((c) => c.invoiceId === invoiceId);
}

function contractFor(S, inv) {
  const s = S.shipments.find((x) => x.id === inv.shipmentId);
  if (!s) return [];
  const q = S.quotes.find((x) => x.id === s.quoteId);
  if (!q) return [];
  /* The accepted quote, not the rate card. The quote is what this customer was
     actually sold, at the margin that applied on the day, and it is the
     document they would produce in a dispute. */
  const fromQuote = q.lines.filter((l) => l.quantity > 0).map((l) => ({
    code: normaliseCode(l.code, aliasMap(S, inv.tenantId)).code,
    unitCents: roundHalfUp(l.sellZar / l.quantity),
    currency: "ZAR", source: `Accepted quote of ${day(q.createdAt)}`,
  }));
  /* Plus the agency tariff, for the lines that never appear on a customer
     quote at all — origin handling, terminal charges. Those arrive on an
     agent's own invoice and are exactly where handling errors live. */
  const covered = new Set(fromQuote.map((c) => c.code));
  return fromQuote.concat((S.agencyTariff || [])
    .filter((c) => !c.tenantId || c.tenantId === inv.tenantId)
    .filter((c) => !covered.has(c.code)));
}

function runAudit(S, invoiceId) {
  const inv = S.invoices.find((x) => x.id === invoiceId);
  const s = S.shipments.find((x) => x.id === inv.shipmentId);
  const lines = invoiceLines(S, invoiceId).map((c) => ({ ...c }));
  const p = S.billingProfiles[inv.tenantId];

  const facts = {
    containers: s ? s.containers.length : 0,
    /* One transport document per shipment until multi-B/L consolidation
       exists. Stated rather than assumed: the documentation-fee rule keys off
       it, and a wrong count there produces a wrong finding. */
    documents: 1,
    events: s ? [...new Set(S.events.filter((e) => e.shipmentId === s.id).map((e) => e.type))] : [],
    dischargedAt: s ? s.dischargedAt : null,
    gateOutAt: s ? s.gateOutAt : null,
    emptyReturnedAt: s ? s.emptyReturnedAt : null,
    /* Free time comes off the bill of lading. Where the terminal feed is dark
       it stays null and the demurrage rule reports unverifiable rather than
       computing against a default nobody agreed to. */
    freeTimeDays: INTEGRATIONS.find((i) => i.key === "terminal").live ? (s ? s.freeTimeDays : null) : null,
  };

  const fuel = INTEGRATIONS.find((i) => i.key === "fuel_index").live
    ? { index: "PLATTS_VLSFO_ROTTERDAM", quotedFor: new Date(S.now).toISOString().slice(0, 10),
        unitCents: 380000, currency: "ZAR" }
    : null;

  const res = auditInvoice({
    lines, facts, contract: contractFor(S, inv), fuelBenchmark: fuel,
    issuerVatRegistered: !!p.vatNumber, currency: inv.currency,
    statedSub: inv.subtotalCents, statedVat: inv.vatCents, statedTotal: inv.totalCents,
  });

  /* Persisted, upserted on re-run so opening the screen twice does not double
     the list — and a human's decision is never reset by a re-run. */
  for (const f of res.findings) {
    const key = `${invoiceId}|${f.code}|${f.chargeId || ""}`;
    const prior = S.invoiceExceptions.find((x) => x.key === key);
    if (prior) {
      Object.assign(prior, { sev: f.sev, msg: f.msg, variance: f.variance, detectedAt: S.now });
    } else {
      S.invoiceExceptions.push({ id: uid(S, "ex"), key, tenantId: inv.tenantId, invoiceId,
        chargeId: f.chargeId, code: f.code, sev: f.sev, status: "OPEN", msg: f.msg,
        variance: f.variance, detectedAt: S.now, resolvedAt: null, note: null });
    }
  }
  /* Findings that no longer reproduce are resolved, not deleted: the record
     that an exception existed and went away is the audit trail. */
  const live = new Set(res.findings.map((f) => `${invoiceId}|${f.code}|${f.chargeId || ""}`));
  for (const x of S.invoiceExceptions) {
    if (x.invoiceId === invoiceId && x.status === "OPEN" && !live.has(x.key)) {
      x.status = "RESOLVED"; x.resolvedAt = S.now; x.note = "No longer reproduced by the audit";
    }
  }
  inv.auditedAt = S.now;
  emit(S, { type: "invoice.audited", tenantId: inv.tenantId, shipmentId: inv.shipmentId, src: "audit",
    payload: { invoiceId, findings: res.findings.length, matchedSources: `${res.summary.matched}/4`,
      queryable: money(res.findings.reduce((a, f) => a + Math.max(0, f.variance || 0), 0), inv.currency) } });
  return res;
}

function resolveException(S, exceptionId, status, note) {
  const x = S.invoiceExceptions.find((e) => e.id === exceptionId);
  if (!x) return null;
  x.status = status;
  x.note = note || null;
  x.resolvedAt = status === "DISPUTED" ? null : S.now;
  /* Querying a line marks the charge, and the document holds that amount back
     from the balance while still showing it — netting it off would quietly
     reissue the invoice. */
  if (x.chargeId) {
    const c = S.charges.find((ch) => ch.id === x.chargeId);
    if (c) c.disputed = status === "DISPUTED";
  }
  return x;
}

/* ------------------------------------------------------------- filings --- */

function lodgeFiling(S, shipmentId, kind, payload) {
  const s = S.shipments.find((x) => x.id === shipmentId);
  const edi = INTEGRATIONS.find((i) => i.key === "sars_edi");
  const missing = edi.keys.filter(() => !edi.live);
  const ref = `SUB-${kind}-${s.reference}`;

  const prior = S.filings.find((f) => f.submissionRef === ref);
  if (prior) { prior.payload = payload; return prior; }

  const f = {
    id: uid(S, "fil"), tenantId: s.tenantId, shipmentId, kind, authority: "SARS",
    status: edi.live ? "SUBMITTED" : "QUEUED", payload, submissionRef: ref,
    authorityRef: edi.live ? `MRN26ZA${400000 + S.seq}` : null,
    /* Unconfigured, the declaration is still built, validated and stored. It
       stops here with the reason on it rather than being refused, because a
       complete declaration waiting on somebody's accreditation is worth
       something and a lost one is not. */
    lastError: edi.live ? null : `Not transmitted: SARS Customs EDI is not configured (${missing.join(", ")}). The declaration is stored and can be captured on eFiling.`,
    submittedAt: edi.live ? S.now : null, createdAt: S.now,
  };
  S.filings.push(f);
  emit(S, { type: edi.live ? "filing.submitted" : "filing.queued", tenantId: s.tenantId,
    shipmentId, src: "sars-filing", payload: { kind, submissionRef: ref, status: f.status } });
  return f;
}

/* ------------------------------------------------------------- populate -- */

/* The book, built by driving the actions above. Nothing below writes a row
   directly. */
function populate(S) {
  const cargo = (over) => ({
    description: "General merchandise", cargoType: "GENERAL", urgency: "STANDARD",
    portOfExit: "CNSHA", portOfEntry: "ZADUR",
    items: [{ description: "Cartons", packageType: "CARTON", pieces: 300,
      grossWeightGrams: 6_000_000, lengthMm: 600, widthMm: 400, heightMm: 400, stackable: true }],
    ...over,
  });

  /* The entry has to exist before the shipment reaches the customs milestones,
     or `advance` finds nothing to move to SUBMITTED and the duty disbursement
     accrues against a total of zero. Order matters here for the same reason it
     matters in the real system: these are consumers reacting to events, not a
     script filling in a table. */
  const ENTRY_AT = 5; // container.discharged — the point an entry is lodgeable

  const book = (spec) => {
    const owner = spec.tenantId || "t-op";
    const cons = createConsignment(S, owner, cargo(spec.cargo), spec.mode);
    const q = createQuote(S, owner, {
      customerId: spec.customerId, origin: spec.origin, destination: spec.destination,
      mode: spec.mode, containerType: spec.eq, containerQuantity: spec.qty,
      incoterm: spec.incoterm || "CIF", consignment: cons,
      urgency: cons.urgency,
    });
    const s = bookQuote(S, q.id, spec.carrierRef);

    for (let i = 0; i < Math.min(spec.steps, ENTRY_AT); i++) advance(S, s.id, 10 + (i % 5) * 6);
    if (spec.steps >= ENTRY_AT) {
      const guess = classify(cons.description)[0];
      createEntry(S, s.id, [{
        description: cons.description,
        hsCode: guess ? guess.hs : null,
        dutyRateBps: guess ? guess.rateBps : 0,
        /* Declared value of the goods, not the freight. Duty on a container of
           apparel routinely exceeds what it cost to move it, which is exactly
           why a forwarder fronting it needs the disbursement tracked. */
        customsValueCents: 45_000_000 + s.containers.length * 38_000_000,
        sacuOrigin: false,
      }]);
    }
    for (let i = ENTRY_AT; i < spec.steps; i++) advance(S, s.id, 10 + (i % 5) * 6);
    return s;
  };

  const jobs = [
    { customerId: "p-ubuntu", origin: "CNSHA", destination: "ZADUR", mode: "OCEAN", eq: "40HC", qty: 2, steps: 9,
      carrierRef: "MAEU8841203", cargo: { description: "Cotton knitted T-shirts, printed, for retail distribution",
        items: [{ description: "Cotton T-shirts", packageType: "CARTON", pieces: 420,
          grossWeightGrams: 8_400_000, lengthMm: 600, widthMm: 400, heightMm: 400,
          stackable: true, marksAndNumbers: "UBT/DUR/1-420", hsCode: "6109.10" }] } },
    { customerId: "p-kalahari", origin: "DEHAM", destination: "ZADUR", mode: "OCEAN", eq: "40HC", qty: 1, steps: 9,
      carrierRef: "MAEU7710942", cargo: { description: "Industrial fabric rolls and haberdashery",
        portOfExit: "DEHAM",
        items: [{ description: "Fabric rolls", packageType: "ROLL", pieces: 88,
          grossWeightGrams: 15_400_000, lengthMm: 1800, widthMm: 500, heightMm: 500, stackable: false }] } },
    { customerId: "p-savanna", origin: "ZADUR", destination: "NLRTM", mode: "OCEAN", eq: "40RF", qty: 3, steps: 5,
      carrierRef: "MAEU5520118", cargo: { description: "Fresh table grapes, export grade",
        cargoType: "REEFER", urgency: "EXPRESS", portOfExit: "ZADUR", portOfEntry: "NLRTM",
        tempMinDeciC: -5, tempMaxDeciC: 5,
        items: [{ description: "Grapes, 4.5 kg cartons", packageType: "CARTON", pieces: 4400,
          grossWeightGrams: 19_800_000, lengthMm: 400, widthMm: 300, heightMm: 180, stackable: true }] } },
    { customerId: "p-nordwind", origin: "DEHAM", destination: "ZADUR", mode: "OCEAN", eq: "40HC", qty: 1, steps: 3,
      carrierRef: "MAEU7710988", cargo: { description: "Compression-ignition engine assemblies",
        cargoType: "OVERSIZED", portOfExit: "DEHAM",
        items: [{ description: "Engine assemblies, crated", packageType: "CRATE", pieces: 6,
          grossWeightGrams: 11_200_000, lengthMm: 2400, widthMm: 1200, heightMm: 1400, stackable: false }] } },
    { customerId: "p-ubuntu", origin: "INNSA", destination: "ZADUR", mode: "OCEAN", eq: "20GP", qty: 1, steps: 2,
      carrierRef: "CMDU3390221", cargo: { description: "Moulded plastic components", portOfExit: "INNSA",
        items: [{ description: "Plastic components", packageType: "BAG", pieces: 640,
          grossWeightGrams: 9_600_000, lengthMm: 700, widthMm: 500, heightMm: 400, stackable: true }] } },
    { customerId: "p-kalahari", origin: "CNSHA", destination: "ZADUR", mode: "OCEAN", eq: "40HC", qty: 1, steps: 1,
      carrierRef: null, cargo: { description: "Assorted haberdashery and trims",
        items: [{ description: "Trims and fastenings", packageType: "CARTON", pieces: 210,
          grossWeightGrams: 3_150_000, lengthMm: 500, widthMm: 400, heightMm: 350, stackable: true }] } },
    { customerId: "p-savanna", origin: "ZADUR", destination: "ZAJNB", mode: "ROAD", eq: "40HC", qty: 1, steps: 9,
      carrierRef: null, cargo: { description: "Citrus for domestic distribution",
        cargoType: "PERISHABLE", portOfExit: "ZADUR", portOfEntry: "ZAJNB",
        pickupLocode: "ZADUR", pickupAddress: "Bayhead cold store, Durban",
        items: [{ description: "Oranges, 15 kg cartons", packageType: "CARTON", pieces: 1200,
          grossWeightGrams: 18_000_000, lengthMm: 400, widthMm: 300, heightMm: 260, stackable: true }] } },
    { customerId: "p-orion", origin: "CNSHA", destination: "ZADUR", mode: "OCEAN", eq: "40HC", qty: 2, steps: 9,
      carrierRef: "MAEU8841772", cargo: { description: "Fabricated steel brackets",
        items: [{ description: "Steel brackets, banded", packageType: "PALLET", pieces: 24,
          grossWeightGrams: 21_600_000, lengthMm: 1200, widthMm: 1000, heightMm: 900, stackable: true }] } },
  ];

  /* One unbookable job must not blank the whole console. The engine refuses a
     service level it cannot meet — correctly — and a seed that trips that rule
     should lose one shipment, not the application. */
  const built = [];
  for (const j of jobs) {
    try { built.push(book(j)); }
    catch (err) { console.warn("seed: skipped a job —", err.message); }
  }

  /* Invoice the shipments that have finished moving. */
  for (const s of built) {
    if (s.step < 8) continue;
    const invs = issueInvoice(S, s.id, {
      customerReference: `PO-${88000 + S.seq}`,
    });
    for (const inv of invs) runAudit(S, inv.id);
  }

  /* Money in, in the shapes finance actually sees. */
  const settled = S.invoices[0];
  if (settled) {
    recordPayment(S, settled.id, { amountCents: Math.round(settled.totalCents * 0.4), paymentRef: "FNB-2026-114872" });
    recordPayment(S, settled.id, { amountCents: settled.totalCents - Math.round(settled.totalCents * 0.4), paymentRef: "FNB-2026-115003" });
  }
  const part = S.invoices[1];
  if (part) recordPayment(S, part.id, { amountCents: Math.round(part.totalCents * 0.35), paymentRef: "SBSA-2026-77120" });

  /* An invoice already past its terms, so the overdue sweep has something to
     find and the finance screen is not uniformly green. */
  if (S.invoices[2]) S.invoices[2].dueDate = S.now - 9 * DAY;
  markOverdue(S);

  /* Exceptions the ops desk is actually looking at. */
  const rolled = built[3];
  if (rolled) {
    emit(S, { type: "booking.rolled", tenantId: rolled.tenantId, shipmentId: rolled.id, src: "DCSA",
      payload: { reason: "Carrier omitted the port call", etaShift: "+7d" } });
    S.exceptions.push({ id: uid(S, "exc"), tenantId: rolled.tenantId, shipmentId: rolled.id,
      code: "BOOKING_ROLLED", status: "OPEN", detail: "Carrier omitted the Durban port call; ETA moves out seven days.",
      raisedAt: S.now });
    rolled.eta += 7 * DAY;
  }
  const held = built[7];
  if (held) {
    emit(S, { type: "compliance.hold_placed", tenantId: held.tenantId, shipmentId: held.id, src: "yente",
      payload: { partyId: "p-orion", verdict: "REVIEW", matchScore: 0.71 } });
    S.exceptions.push({ id: uid(S, "exc"), tenantId: held.tenantId, shipmentId: held.id,
      code: "COMPLIANCE_HOLD", status: "OPEN",
      detail: "Orion Metals Trading matched a watchlist entry at 0.71. A human has to clear or refuse it before this moves.",
      raisedAt: S.now });
  }
  const queried = built[1];
  if (queried) {
    emit(S, { type: "entry.queried", tenantId: queried.tenantId, shipmentId: queried.id, src: "SARS",
      payload: { query: "Tariff heading queried — supporting invoice requested" } });
    S.exceptions.push({ id: uid(S, "exc"), tenantId: queried.tenantId, shipmentId: queried.id,
      code: "CUSTOMS_QUERY", status: "OPEN",
      detail: "SARS queried the tariff heading and asked for the supplier invoice.", raisedAt: S.now });
  }

  /* Documents waiting on a human, with the confidence that put them there. */
  const docs = [
    { name: "commercial-invoice-UBT-4471.pdf", kind: "COMMERCIAL_INVOICE", shipment: built[0], conf: 0.94,
      fields: { invoiceNumber: "UBT-4471", seller: "Shanghai Yicheng Apparel Co.", value: "USD 41,200.00", incoterm: "FOB" } },
    { name: "packing-list-UBT-4471.pdf", kind: "PACKING_LIST", shipment: built[0], conf: 0.88,
      fields: { cartons: "420", grossWeight: "8,400 kg", marks: "UBT/DUR/1-420" } },
    { name: "bill-of-lading-MAEU7710942.pdf", kind: "BILL_OF_LADING", shipment: built[1], conf: 0.71,
      fields: { blNumber: "MAEU7710942", shipper: "Nordwind Maschinenbau GmbH", freeTime: "5 days" } },
    { name: "scan-0041.jpg", kind: "UNKNOWN", shipment: built[4], conf: 0.42,
      fields: { note: "Low-resolution phone photograph; most fields unreadable" } },
  ];
  for (const d of docs) {
    if (!d.shipment) continue;
    S.documents.push({ id: uid(S, "doc"), tenantId: "t-op", shipmentId: d.shipment.id,
      filename: d.name, kind: d.kind, confidence: d.conf,
      /* Below the review threshold is not a failure — it is the system saying
         it will not guess at a number that ends up on a customs declaration. */
      status: d.conf >= 0.85 ? "EXTRACTED" : "NEEDS_REVIEW",
      fields: d.fields, uploadedAt: S.now - Math.round(Math.random() * 3) * DAY });
    emit(S, { type: "document.uploaded", tenantId: "t-op", shipmentId: d.shipment.id,
      payload: { filename: d.name, kind: d.kind } });
  }

  /* A declaration lodged with the channel dark, so the compliance screen has
     the honest state on it rather than an empty table. */
  const filed = built.find((s) => entryFor(S, s));
  if (filed) {
    const e = entryFor(S, filed);
    lodgeFiling(S, filed.id, "SARS_CUSDEC", {
      reference: e.reference, lines: e.lines.length,
      customsValue: money(entryTotals(e).customsValue, "ZAR"),
      duty: money(entryTotals(e).duty, "ZAR"), vat: money(entryTotals(e).vat, "ZAR"),
    });
  }

  /* The partner's own book, on the same rails. Built by the same pipeline, so
     every screen it has is populated by the same code the operator's is — and
     none of it appears in the operator's lists, because every read carries a
     tenant predicate rather than a filter somebody remembered to add. */
  const partnerJobs = [
    { tenantId: "t-pa", customerId: "p-cc-cust", origin: "ZACPT", destination: "BRSSZ",
      mode: "OCEAN", eq: "40RF", qty: 2, steps: 9, carrierRef: "CMDU8871220",
      cargo: { description: "Export-grade apples and pears, controlled atmosphere",
        cargoType: "REEFER", urgency: "EXPRESS", portOfExit: "ZACPT", portOfEntry: "BRSSZ",
        tempMinDeciC: -5, tempMaxDeciC: 15,
        items: [{ description: "Apples, 12.5 kg cartons", packageType: "CARTON", pieces: 3600,
          grossWeightGrams: 22_500_000, lengthMm: 400, widthMm: 300, heightMm: 260,
          stackable: true, marksAndNumbers: "OFC/SSZ/1-3600" }] } },
    { tenantId: "t-pa", customerId: "p-cc-cust", origin: "ZACPT", destination: "NLRTM",
      mode: "OCEAN", eq: "40RF", qty: 1, steps: 9, carrierRef: "MAEU4410771",
      cargo: { description: "Table grapes, export grade", cargoType: "REEFER", urgency: "EXPRESS",
        portOfExit: "ZACPT", portOfEntry: "NLRTM", tempMinDeciC: -5, tempMaxDeciC: 5,
        items: [{ description: "Grapes, 4.5 kg punnets", packageType: "CARTON", pieces: 2800,
          grossWeightGrams: 12_600_000, lengthMm: 400, widthMm: 300, heightMm: 180, stackable: true }] } },
    { tenantId: "t-pa", customerId: "p-cc-cust", origin: "ZACPT", destination: "ZAPLZ",
      mode: "ROAD", eq: "40HC", qty: 1, steps: 4, carrierRef: null,
      cargo: { description: "Packaging materials for the Gqeberha pack house",
        portOfExit: "ZACPT", portOfEntry: "ZAPLZ", pickupLocode: "ZACPT",
        pickupAddress: "Unit 9, Montague Gardens, Cape Town",
        items: [{ description: "Corrugated cartons, flat-packed", packageType: "BALE", pieces: 180,
          grossWeightGrams: 5_400_000, lengthMm: 1200, widthMm: 800, heightMm: 600, stackable: true }] } },
  ];

  const partnerBuilt = [];
  for (const j of partnerJobs) {
    try { partnerBuilt.push(book(j)); }
    catch (err) { console.warn("seed: skipped a partner job —", err.message); }
  }

  for (const s of partnerBuilt) {
    if (s.step < 8) continue;
    const invs = issueInvoice(S, s.id, { customerReference: `OFC-${4400 + S.seq}` });
    for (const inv of invs) runAudit(S, inv.id);
  }

  const pInv = S.invoices.filter((i) => i.tenantId === "t-pa");
  if (pInv[0]) recordPayment(S, pInv[0].id, {
    amountCents: Math.round(pInv[0].totalCents * 0.55), paymentRef: "ABSA-2026-30188" });
  if (pInv[1]) pInv[1].dueDate = S.now - 5 * DAY;
  markOverdue(S);

  if (partnerBuilt[1]) {
    emit(S, { type: "booking.rolled", tenantId: "t-pa", shipmentId: partnerBuilt[1].id, src: "DCSA",
      payload: { reason: "Reefer plug shortage at Cape Town", etaShift: "+4d" } });
    S.exceptions.push({ id: uid(S, "exc"), tenantId: "t-pa", shipmentId: partnerBuilt[1].id,
      code: "BOOKING_ROLLED", status: "OPEN",
      detail: "Reefer plug shortage at Cape Town; the box rolls to the next sailing.", raisedAt: S.now });
    partnerBuilt[1].eta += 4 * DAY;
  }

  if (partnerBuilt[0]) {
    S.documents.push({ id: uid(S, "doc"), tenantId: "t-pa", shipmentId: partnerBuilt[0].id,
      filename: "phytosanitary-cert-OFC-8871.pdf", kind: "CERTIFICATE", confidence: 0.79,
      status: "NEEDS_REVIEW",
      fields: { issuer: "DALRRD", commodity: "Malus domestica", treatment: "Cold sterilisation, 24 days" },
      uploadedAt: S.now - DAY });
    emit(S, { type: "document.uploaded", tenantId: "t-pa", shipmentId: partnerBuilt[0].id,
      payload: { filename: "phytosanitary-cert-OFC-8871.pdf", kind: "CERTIFICATE" } });

    const pe = entryFor(S, partnerBuilt[0]);
    if (pe) lodgeFiling(S, partnerBuilt[0].id, "SARS_EXPORT_RELEASE", {
      reference: pe.reference, lines: pe.lines.length,
      customsValue: money(entryTotals(pe).customsValue, "ZAR") });
  }

  /* Leave the clock where the work left it, one day on. Setting it back to the
     start would stamp everything the user does next as earlier than the seed —
     an append-only log that reads out of order is a log nobody trusts. */
  S.now = Math.max(S.now, ...S.events.map((e) => e.occurredAt)) + DAY;
  return S;
}

/* ==========================================================================
 * SHELL — chrome, navigation, routing, and the small building blocks the
 * screens are written in.
 * ======================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const S = populate(seed());

/* ---------------------------------------------------------------- atoms -- */

const tag = (text, tone = "", dot = false) =>
  `<span class="tag ${tone}">${dot ? "<i></i>" : ""}${esc(text)}</span>`;

const tile = (k, v, o = {}) =>
  `<div class="tile ${o.tone || ""}"><div class="k">${esc(k)}</div>
   <div class="v">${o.raw ? v : esc(v)}</div>${o.sub ? `<div class="s">${o.sub}</div>` : ""}</div>`;

const panel = (o) => `<section class="panel ${o.flush ? "flush" : ""}">
  ${o.title ? `<div class="panel-head" ${o.flush ? 'style="padding:14px 16px 6px"' : ""}>
    <div>${o.eyebrow ? `<div class="eyebrow ${o.eyebrowTone || ""}">${esc(o.eyebrow)}</div>` : ""}
    <h2>${esc(o.title)}</h2></div>
    ${o.actions ? `<div class="actions">${o.actions}</div>` : ""}</div>` : ""}
  ${o.body}</section>`;

const empty = (t, d) => `<div class="empty"><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div></div>`;

const kv = (k, v, cls = "") => `<div class="kv ${cls}"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;

function table(cols, rows, o = {}) {
  if (!rows.length) return empty(o.emptyTitle || "Nothing here yet", o.emptyBody || "");
  return `<div class="scroll-x"><table class="tbl"><thead><tr>${
    cols.map((c) => `<th ${c.align === "r" ? 'class="r"' : ""}>${esc(c.label)}</th>`).join("")
  }</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

function toast(kind, title, detail) {
  const box = $("#toasts");
  /* Capped. An operator running a batch of actions should see the last few,
     not a column of notices covering the screen they are trying to read. */
  while (box.children.length >= 3) box.firstChild.remove();
  const n = document.createElement("div");
  n.className = `toast ${kind}`;
  n.innerHTML = `<div class="tt">${esc(title)}</div>${detail ? `<div class="td">${esc(detail)}</div>` : ""}`;
  box.appendChild(n);
  setTimeout(() => { n.style.transition = "opacity .3s"; n.style.opacity = "0";
    setTimeout(() => n.remove(), 320); }, 4600);
}

/* --------------------------------------------------------------- routes -- */

/* Which kind of tenant a route belongs to. Hiding a nav item is presentation,
   not access control — typing the path in still has to be refused, which is
   what `guard()` below does. */
const OPERATIONAL = ["OPERATOR", "PARTNER_AGENT"];

const NAV = [
  { group: "Overview", items: [
    { path: "/",                 label: "Dashboard",        for: OPERATIONAL },
    { path: "/system",           label: "System Monitor",   for: ["OPERATOR"] },
    { path: "/track",            label: "My Shipments",     for: ["CUSTOMER"] },
    { path: "/track/invoices",   label: "My Invoices",      for: ["CUSTOMER"] },
  ] },
  { group: "Commercial", items: [
    { path: "/quotes/new",       label: "New Quote",        for: OPERATIONAL },
    { path: "/rates",            label: "Rates & Margin",   for: OPERATIONAL },
    { path: "/shipments",        label: "Shipments",        for: OPERATIONAL, count: () => visibleShipments(S).filter((s) => s.status !== "DELIVERED").length },
    { path: "/ops",              label: "Ops Console",      for: OPERATIONAL, count: () => openExceptions().length, tone: "bad" },
  ] },
  { group: "Compliance", items: [
    { path: "/customs",          label: "Customs",          for: OPERATIONAL },
    { path: "/documents",        label: "Documents",        for: OPERATIONAL, count: () => S.documents.filter((d) => d.tenantId === tenantOf(S) && d.status === "NEEDS_REVIEW").length, tone: "warn" },
    { path: "/parties",          label: "Parties",          for: OPERATIONAL },
    { path: "/integrations",     label: "External Systems", for: OPERATIONAL },
  ] },
  { group: "Finance", items: [
    { path: "/invoices",         label: "Invoices",         for: OPERATIONAL },
    { path: "/billing/exceptions", label: "Invoice Audit",  for: OPERATIONAL, count: () => openFindings().length, tone: "warn" },
    { path: "/billing/settings", label: "Billing Settings", for: OPERATIONAL },
    { path: "/finance",          label: "Finance Views",    for: OPERATIONAL },
    { path: "/platform-fees",    label: "Platform Fees",    for: ["PARTNER_AGENT"] },
  ] },
  { group: "Infrastructure", items: [
    { path: "/partners",         label: "Partners",         for: ["OPERATOR"] },
  ] },
];

const openExceptions = () => S.exceptions.filter((e) => e.tenantId === tenantOf(S) && e.status === "OPEN");
const openFindings = () => S.invoiceExceptions.filter((e) => e.tenantId === tenantOf(S)
  && (e.status === "OPEN" || e.status === "DISPUTED"));

function tenantType() { return S.tenants.find((t) => t.id === tenantOf(S)).type; }

/* The authority the nav merely reflects. A customer typing /invoices gets sent
   home rather than a page of error states dressed up as a screen. */
function mayVisit(path) {
  const tt = tenantType();
  const customerOnly = path === "/track" || path.startsWith("/track/");
  if (customerOnly) return tt === "CUSTOMER";
  const operational = ["/", "/system", "/quotes", "/rates", "/shipments", "/ops", "/customs",
    "/documents", "/parties", "/integrations", "/invoices", "/billing", "/finance",
    "/platform-fees", "/partners"];
  if (operational.some((p) => path === p || path.startsWith(p + "/"))) return tt !== "CUSTOMER";
  return true;
}
const homePath = () => (tenantType() === "CUSTOMER" ? "/track" : "/");

/* --------------------------------------------------------------- router -- */

const currentPath = () => (location.hash.slice(1) || "/").split("?")[0];

const ROUTES = [];
const route = (re, fn) => ROUTES.push({ re, fn });

function render() {
  let path = currentPath();
  if (!mayVisit(path)) {
    toast("warn", "Not your screen",
      `A ${tenantType().toLowerCase().replace("_", " ")} tenant has no access to ${path}.`);
    location.hash = homePath();
    return;
  }
  const view = $("#view");
  for (const r of ROUTES) {
    const m = path.match(r.re);
    if (m) {
      view.innerHTML = r.fn(...m.slice(1));
      view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter");
      renderShell();
      window.scrollTo({ top: 0 });
      bind();
      return;
    }
  }
  view.innerHTML = empty("No such screen", `Nothing is routed at ${path}.`);
  renderShell();
}

const go = (p) => { location.hash = p; };

/* Delegated so screens never wire their own listeners — every screen is a
   pure string of HTML, re-rendered from state, and nothing survives a render
   that shouldn't. */
function bind() {
  $$("[data-go]").forEach((n) => n.addEventListener("click", (e) => {
    if (e.target.closest("button,a,input")) return;
    go(n.dataset.go);
  }));
  $$("[data-act]").forEach((n) => n.addEventListener("click", (e) => {
    e.stopPropagation();
    ACTIONS[n.dataset.act] && ACTIONS[n.dataset.act](n, e);
  }));
  $$("[data-live]").forEach((n) => n.addEventListener("input", () => {
    LIVE[n.dataset.live] && LIVE[n.dataset.live](n);
  }));
  $$("[data-change]").forEach((n) => n.addEventListener("change", () => {
    LIVE[n.dataset.change] && LIVE[n.dataset.change](n);
  }));
}

LIVE.qf = (n) => {
  const k = n.dataset.k;
  if (k === "lane") {
    const [o, d, m] = n.value.split("|");
    QF.origin = o; QF.destination = d; QF.mode = m;
  } else if (k === "qty") QF.qty = Math.max(1, Math.min(20, Number(n.value) || 1));
  else QF[k] = n.value;
  QF.result = null; QF.error = null;
  if (["description", "pickupLocode", "pickupAddress", "unNumber", "imoClass", "packingGroup", "tempMin", "tempMax"].includes(k)) {
    /* Text fields recompute the panel beside them without stealing the caret,
       so only the measured block is repainted. */
    repaintMeasure();
  } else render();
};

LIVE.item = (n) => {
  const it = QF.items[Number(n.dataset.i)];
  const k = n.dataset.k;
  it[k] = ["pieces", "weightKg", "l", "w", "h"].includes(k) ? Number(n.value) : n.value;
  QF.result = null;
  if (n.dataset.change !== undefined) render(); else repaintMeasure();
};

function repaintMeasure() {
  const draft = consignmentDraft();
  const m = computeTotals(draft.items, QF.mode);
  const tiles = $$("#view .tile .v");
  if (tiles.length >= 4) {
    tiles[tiles.length - 4].textContent = num(m.pieces);
    tiles[tiles.length - 3].textContent = kg(m.grossWeightGrams);
    tiles[tiles.length - 2].textContent = cbm(m.volumeCm3);
    tiles[tiles.length - 1].textContent = kg(m.chargeableWeightGrams);
  }
}

ACTIONS.delItem = (n) => { QF.items.splice(Number(n.dataset.i), 1); render(); };

ACTIONS.price = () => {
  QF.error = null;
  try {
    const cons = consignmentDraft();
    const blocking = handlingRequirements(cons).filter((r) => r.blocking);
    if (blocking.length) throw Object.assign(new Error(blocking[0].description), { kind: "BLOCKED" });
    /* The tenant predicate again. Pricing from the screen went through
       buildQuote without it, so selectRateCards filtered on `undefined` and
       every quote raised from the form came back "no valid rate card" — on a
       lane the operator demonstrably had a card for. The seeded book hid it
       because populate() prices through createQuote, which passes it. */
    QF.result = buildQuote(S, {
      tenantId: tenantOf(S),
      customerId: QF.customerId, origin: QF.origin, destination: QF.destination, mode: QF.mode,
      containerType: QF.eq, containerQuantity: QF.qty, incoterm: QF.incoterm,
      consignment: cons, urgency: QF.urgency,
    });
  } catch (e) { QF.error = e; QF.result = null; }
  render();
  if (QF.result) toast("good", "Priced",
    `${QF.result.card.carrier} at ${money(QF.result.totalZar)} — margin rule ${QF.result.rule.id}.`);
  /* "We don't serve that corridor" and "we serve it in 34 days and you asked
     for 10" are different conversations, and answering the second with the
     first loses the sale for the wrong reason. */
  else if (QF.error) toast("warn", QF.error.kind === "NO_SERVICE_LEVEL" ? "No service at that level" : "Cannot price this", QF.error.message);
};

ACTIONS.book = () => {
  if (!QF.result) return;
  if (!hasRole(S, "ops")) return toast("bad", "Refused", "Booking needs the ops role. This session does not carry it.");
  const cons = createConsignment(S, tenantOf(S), consignmentDraft(), QF.mode);
  const q = createQuote(S, tenantOf(S), {
    customerId: QF.customerId, origin: QF.origin, destination: QF.destination, mode: QF.mode,
    containerType: QF.eq, containerQuantity: QF.qty, incoterm: QF.incoterm,
    consignment: cons, urgency: QF.urgency,
  });
  const ref = ($("#bookref") || {}).value || null;
  const s = bookQuote(S, q.id, ref);
  QF.result = null;
  toast("good", `Booked ${s.reference}`, `${lane(s)} · ${s.containers.length} × ${QF.eq}. Charges accrued from the quote.`);
  go(`/shipments/${s.id}`);
};

/* ================================================================= rates */

route(/^\/rates$/, () => {
  /* This company's own buy and sell sides. Pinned to the operator, it showed a
     partner agent somebody else's carrier rates and margins. */
  const cards = S.rateCards.filter((c) => c.tenantId === tenantOf(S));
  const rules = S.marginRules.filter((r) => r.tenantId === tenantOf(S));
  const validity = (c) => {
    if (S.now > c.validTo) return tag("Expired", "bad", true);
    if (c.validTo - S.now < 21 * DAY) return tag(`${Math.ceil((c.validTo - S.now) / DAY)}d left`, "warn", true);
    return tag("Valid", "good", true);
  };

  return head({ eyebrow: "Commercial", title: "Buy rates, and the margin on top",
    lede: "The buy side and the sell side are separate objects on purpose. A rate card is what a lane costs; a margin rule is what this company sells it for. Renegotiating a carrier rate must not silently reprice every customer." })

  + panel({ eyebrow: "Buy side", title: "Rate cards", flush: true, body:
      table([{ label: "Lane" }, { label: "Mode" }, { label: "Carrier" }, { label: "Eq" },
        { label: "Buy", align: "r" }, { label: "Transit", align: "r" }, { label: "Surcharges" }, { label: "Validity" }],
        cards.map((c) => `<tr>
          <td><span class="mono p">${esc(c.origin)} → ${esc(c.destination)}</span></td>
          <td>${esc(c.mode)}</td>
          <td class="p">${esc(c.carrier)}</td>
          <td class="mono">${esc(c.eq)}</td>
          <td class="r tab p">${money(c.buyCents, c.currency)}</td>
          <td class="r tab">${c.transitDays ? c.transitDays + "d" : "—"}</td>
          <td>${c.surcharges.length
            ? c.surcharges.map((s) => `<span class="tag">${esc(s.code)}</span>`).join(" ")
            : `<span class="muted">none</span>`}</td>
          <td>${validity(c)} <span class="muted small">to ${day(c.validTo)}</span></td></tr>`)) })

  + `<div style="height:16px"></div>`

  + panel({ eyebrow: "Sell side", title: "Margin rules", flush: true, body:
      `<div style="padding:0 16px 6px"><p class="small muted" style="margin:0 0 10px">
        The most specific rule wins, and ties break by recency. Without that tiebreak the same
        quote could price at 15% or 18% depending on row order — a difference a customer
        eventually notices.</p></div>`
      + table([{ label: "Scope" }, { label: "Specificity", align: "r" }, { label: "Margin", align: "r" },
        { label: "Floor per line", align: "r" }, { label: "Added" }],
        rules.slice().sort((a, b) => {
          const d = (r) => [r.customerId, r.origin, r.destination, r.mode].filter(Boolean).length;
          return d(b) - d(a) || b.createdAt - a.createdAt;
        }).map((r) => {
          const dims = [r.customerId, r.origin, r.destination, r.mode].filter(Boolean).length;
          const scope = [r.customerId ? partyName(r.customerId) : null,
            r.origin && r.destination ? `${r.origin} → ${r.destination}` : null, r.mode].filter(Boolean).join(" · ");
          return `<tr>
            <td class="p">${esc(scope || "Everything else")}</td>
            <td class="r tab">${dims}</td>
            <td class="r tab p">${pct(r.marginBps)}</td>
            <td class="r tab">${money(r.minMarginCents)}</td>
            <td class="muted">${day(r.createdAt)}</td></tr>`;
        })) })

  + `<div class="note" style="margin-top:16px">
      <b>The floor is converted before it is compared.</b> It is held in ZAR cents; applying it to a
      USD line as though it were dollars turns an 18% margin into 69%. That is not a number any
      shipper accepts, and it is invisible until somebody quotes a cheap lane.</div>`;
});

/* ============================================================= shipments */

let SHIP_FILTER = "ALL";

ACTIONS.shipFilter = (n) => { SHIP_FILTER = n.dataset.v; render(); };

route(/^\/shipments\/(.+)$/, (id) => {
  const s = shipmentOf(id);
  if (!s || s.tenantId !== tenantOf(S)) return empty("Not found", "This shipment either doesn't exist or isn't yours.");
  const cons = S.consignments.find((c) => c.id === s.consignmentId);
  const charges = S.charges.filter((c) => c.shipmentId === s.id);
  const evts = S.events.filter((e) => e.shipmentId === s.id);
  const entry = entryFor(S, s);
  const invs = S.invoices.filter((i) => i.shipmentId === s.id);
  const excs = S.exceptions.filter((e) => e.shipmentId === s.id && e.status === "OPEN");
  const uninvoiced = charges.filter((c) => !c.invoiceId);
  const done = s.step >= LIFECYCLE.length - 1;

  return head({ eyebrow: "Shipment", title: s.reference,
    actions: `<button class="btn" data-act="advance" data-id="${s.id}" ${done ? "disabled" : ""}>

      ${uninvoiced.length ? `<button class="btn primary" data-act="issueInv" data-id="${s.id}">Issue invoice</button>` : ""}`,
    lede: `${esc(lane(s))} · ${esc(partyName(s.customerId))} · ${esc(s.carrier || "carrier unassigned")}` })

  + `<div class="row" style="margin-bottom:14px">
      ${statusTag(s.status)}
      ${s.blNumber ? tag(`B/L ${s.blNumber}`) : tag("B/L not issued")}
      ${s.carrierBookingRef ? tag(`Booking ${s.carrierBookingRef}`) : ""}
      ${tag(`${s.containers.length} × ${s.containers[0] ? s.containers[0].type : "—"}`)}
      <span class="small muted">ETD ${day(s.etd)} · ETA ${day(s.eta)}</span>
    </div>`

  + (excs.length ? `<div class="note warn" style="margin-top:0">
      ${excs.map((e) => `<div><b>${esc(e.code.replace(/_/g, " "))}</b> — ${esc(e.detail)}</div>`).join("")}
    </div>` : "")

  + `<div class="grid g-53">
      <div class="stack">
        ${cons ? cargoPanel(cons, true) : ""}

        ${panel({ eyebrow: "Accrued by the event consumers", title: "Charges", flush: true, body:
          table([{ label: "Code" }, { label: "Line" }, { label: "Basis" }, { label: "Qty", align: "r" },
            { label: "Buy", align: "r" }, { label: "Sell", align: "r" }, { label: "Invoice" }],
            charges.map((c) => `<tr>
              <td><span class="mono" style="font-size:10.5px">${esc(c.code)}</span></td>
              <td class="p">${esc(c.description)}<div style="margin-top:3px">
                ${tag(PROV_LABEL[c.prov], PROV_TAG[c.prov])}
                <span class="small muted" style="margin-left:5px">${esc(c.triggeredBy)}</span></div></td>
              <td class="muted">${esc(basisPhrase(c.basis))}</td>
              <td class="r tab">${c.qty}</td>
              <td class="r tab muted">${c.buyCents == null ? "—" : money(c.buyCents, c.currency)}</td>
              <td class="r tab p">${money(c.sellCents, c.currency)}</td>
              <td>${c.invoiceId
                ? `<a href="#/invoices/${c.invoiceId}" class="mono small">${esc((S.invoices.find((i) => i.id === c.invoiceId) || {}).number || "")}</a>`
                : `<span class="muted small">unbilled</span>`}</td></tr>`),
            { emptyTitle: "Nothing accrued yet", emptyBody: "Charges are written by the consumers as the freight moves." }) })}

        ${panel({ eyebrow: "Append-only", title: "Event log", flush: true, body:
          `<div style="padding:2px 16px 14px">` + evts.slice().reverse().map((e) => `<div class="evt">
            <span class="ts mono">${stamp(e.occurredAt)}</span>
            <span class="ty mono">${esc(e.type)}</span>
            <span class="pl">${esc(e.src)} · ${esc(Object.entries(e.payload).slice(0, 2).map(([k, v]) => `${k}=${v}`).join("  "))}</span>
          </div>`).join("") + `</div>` })}
      </div>

      <div class="stack">
        ${panel({ eyebrow: "Milestones", title: "Where it is", body:
          `<div class="tl">` + LIFECYCLE.map((m, i) => {
            const cls = i < s.step ? "done" : i === s.step ? "now" : "";
            const ev = evts.find((e) => e.type === m.type);
            return `<div class="tl-step ${cls}">
              <div class="tl-rail"><span class="tl-dot"></span>${i < LIFECYCLE.length - 1 ? `<span class="tl-line"></span>` : ""}</div>
              <div class="tl-body"><div class="tl-t">${esc(m.label)}</div>
              <div class="tl-m">${ev ? stamp(ev.occurredAt) + " · " + esc(m.src) : "—"}</div></div></div>`;
          }).join("") + `</div>` })}

        ${panel({ eyebrow: "Equipment", title: "Containers", body:
          s.containers.map((c) => `<div class="kv"><span class="k">${esc(c.type)}</span>
            <span class="v">${c.number ? esc(c.number) : `<span class="muted">not yet assigned</span>`}</span></div>`).join("") })}

        ${entry ? panel({ eyebrow: "Customs", title: entry.reference,
          actions: `<a class="btn sm" href="#/customs/${entry.id}">Open</a>`, body:
          kv("Status", tag(entry.status, entry.status === "RELEASED" ? "good" : "warn", true))
          + kv("Duty", money(entryTotals(entry).duty))
          + kv("VAT", money(entryTotals(entry).vat))
          + kv("Payable to SARS", money(entryTotals(entry).total), "tot") })
          : panel({ eyebrow: "Customs", title: "No entry yet",
              actions: `<a class="btn sm" href="#/customs">Create one</a>`,
              body: `<p class="small muted" style="margin:0">Nothing has been lodged for this shipment.</p>` })}

        ${invs.length ? panel({ eyebrow: "Billing", title: "Invoices", body:
          invs.map((i) => `<div class="kv"><span class="k">
            <a href="#/invoices/${i.id}" class="mono">${esc(i.number)}</a></span>
            <span class="v">${money(i.totalCents, i.currency)} ${invTag(i.status)}</span></div>`).join("") }) : ""}
      </div>
    </div>`;
});

function cargoPanel(c, commercial) {
  const reqs = handlingRequirements(c);
  return panel({ eyebrow: "What is being shipped", title: "Cargo",
    actions: `${tag(CARGO_TYPES[c.cargoType].label, c.cargoType === "HAZARDOUS" ? "bad" : c.cargoType === "GENERAL" ? "" : "warn", true)}

      </div>
      <div class="scroll-x"><table class="tbl">
        <thead><tr><th>Contents</th><th>Packaging</th><th class="r">Pieces</th><th class="r">Weight</th><th>Per piece</th><th>Marks</th></tr></thead>

          <span class="small" style="flex:1;color:var(--t2)">${esc(r.description)}</span></div>`).join("")}
      </div>` : ""}` });
}

ACTIONS.advance = (n) => {
  if (!hasRole(S, "ops")) return toast("bad", "Refused", "Recording a milestone needs the ops role.");
  const m = advance(S, n.dataset.id);
  if (m) toast("info", m.label, `Recorded from ${m.src}. Any charge that hangs off it has accrued.`);
  render();
};

ACTIONS.roll = (n) => {
  const s = shipmentOf(n.dataset.id);
  if (S.exceptions.some((e) => e.shipmentId === s.id && e.code === "BOOKING_ROLLED" && e.status === "OPEN"))
    return toast("info", "Already rolled", "There is an open roll exception on this shipment.");
  emit(S, { type: "booking.rolled", tenantId: s.tenantId, shipmentId: s.id, src: "DCSA",
    payload: { reason: "Carrier omitted the port call", etaShift: "+7d" } });
  S.exceptions.push({ id: uid(S, "exc"), tenantId: s.tenantId, shipmentId: s.id, code: "BOOKING_ROLLED",
    status: "OPEN", detail: "Carrier omitted the port call; ETA moves out seven days.", raisedAt: S.now });
  s.eta += 7 * DAY;
  toast("warn", "Booking rolled", "An exception is open on the ops console and the ETA has moved.");
  render();
};

ACTIONS.issueInv = (n) => {
  if (!hasRole(S, "finance")) return toast("bad", "Refused", "Issuing an invoice needs the finance role.");
  try {
    const invs = issueInvoice(S, n.dataset.id, { customerReference: `PO-${88000 + S.seq}` });
    toast("good", `Issued ${invs[0].number}`, `${money(invs[0].totalCents, invs[0].currency)} due ${day(invs[0].dueDate)}.`);
    go(`/invoices/${invs[0].id}`);
  } catch (e) { toast("warn", "Nothing to invoice", e.message); }
};

/* =================================================================== ops */

route(/^\/ops$/, () => {
  const excs = S.exceptions.filter((e) => e.tenantId === tenantOf(S));
  const cols = [
    { code: "BOOKING_ROLLED", label: "Rolled bookings" },
    { code: "CUSTOMS_QUERY", label: "Customs queries" },
    { code: "CUSTOMS_STOP", label: "Customs stops" },
    { code: "COMPLIANCE_HOLD", label: "Compliance holds" },
  ];
  return head({ eyebrow: "Commercial", title: "What needs a human today",
    lede: "Exceptions are raised by the projector from the event stream, not typed in by anybody. Clearing one is a decision with a name on it." })
  + `<div class="kanban">` + cols.map((c) => {
    const items = excs.filter((e) => e.code === c.code && e.status === "OPEN");
    return `<div>
      <div class="col-head"><span>${esc(c.label)}</span><span>${items.length}</span></div>
      ${items.map((e) => { const s = shipmentOf(e.shipmentId); return `<div class="card" data-go="/shipments/${e.shipmentId}">
        <div class="ref">${esc(s ? s.reference : "—")}</div>
        <div class="ttl">${esc(e.detail)}</div>
        <div class="sub">${esc(s ? lane(s) : "")} · raised ${ago(e.raisedAt, S.now)}</div>
        <div class="row" style="margin-top:9px">
          <button class="btn sm" data-act="clearExc" data-id="${e.id}">Clear</button></div>
      </div>`; }).join("") || `<div class="empty" style="padding:18px"><div class="d">Nothing open.</div></div>`}
    </div>`;
  }).join("") + `</div>`;
});

ACTIONS.clearExc = (n) => {
  const e = S.exceptions.find((x) => x.id === n.dataset.id);
  e.status = "CLEARED";
  emit(S, { type: "shipment.exception_cleared", tenantId: e.tenantId, shipmentId: e.shipmentId,
    src: "projector", payload: { code: e.code } });
  toast("good", "Exception cleared", `${e.code.replace(/_/g, " ")} closed and written to the log.`);
  render();
};

/* =============================================================== customs */

route(/^\/customs$/, () => {

      table([{ label: "Reference" }, { label: "Shipment" }, { label: "Lines", align: "r" },
        { label: "Customs value", align: "r" }, { label: "Duty", align: "r" }, { label: "VAT", align: "r" },

          return `<tr class="rowlink" data-go="/customs/${e.id}">

  + (candidates.length ? `<div style="height:16px"></div>` + panel({

      table([{ label: "Reference" }, { label: "Lane" }, { label: "Goods" }, { label: "" }],
        candidates.map((s) => { const c = S.consignments.find((x) => x.id === s.consignmentId);
          return `<tr><td><span class="mono">${esc(s.reference)}</span></td>
            <td>${esc(lane(s))}</td><td class="p">${esc(c ? c.description : "—")}</td>
            <td class="r"><button class="btn sm" data-act="newEntry" data-id="${s.id}">Create entry</button></td></tr>`; })) }) : "");
});

ACTIONS.newEntry = (n) => {
  const s = shipmentOf(n.dataset.id);
  const c = S.consignments.find((x) => x.id === s.consignmentId);
  const guess = classify(c ? c.description : "")[0];
  const e = createEntry(S, s.id, [{
    description: c ? c.description : "Goods",
    hsCode: guess ? guess.hs : null, dutyRateBps: guess ? guess.rateBps : 0,
    customsValueCents: 45_000_000 + s.containers.length * 38_000_000, sacuOrigin: false,
  }]);
  toast("good", `Entry ${e.reference} prepared`, guess
    ? `Classified ${guess.hs} at ${(guess.confidence * 100).toFixed(0)}% confidence — confirm it before lodging.`
    : "No tariff match; classify the line by hand.");
  go(`/customs/${e.id}`);
};

route(/^\/customs\/(.+)$/, (id) => {
  const e = S.entries.find((x) => x.id === id);
  if (!e || e.tenantId !== tenantOf(S)) return empty("Not found", "No such entry in this tenant.");
  const s = shipmentOf(e.shipmentId);
  const t = entryTotals(e);
  const allConfirmed = e.lines.every((l) => l.confirmed && l.hsCode);
  const filing = S.filings.find((f) => f.shipmentId === e.shipmentId);

  return head({ eyebrow: "Customs entry", title: e.reference,
    lede: `${esc(s ? s.reference : "")} · ${esc(s ? lane(s) : "")}`,
    actions: `${e.status === "DRAFT" ? `<button class="btn primary" data-act="submitEntry" data-id="${e.id}" ${allConfirmed ? "" : "disabled"}>Lodge with SARS</button>` : ""}
      ${e.status === "SUBMITTED" ? `<button class="btn" data-act="releaseEntry" data-id="${e.id}">Record release</button>` : ""}` })

  + `<div class="row" style="margin-bottom:14px">${tag(e.status, e.status === "RELEASED" ? "good" : e.status === "DRAFT" ? "" : "warn", true)}
      ${allConfirmed ? tag("All lines classified", "good") : tag("Classification incomplete", "warn")}</div>`

  + `<div class="grid g-53"><div class="stack">
      ${panel({ eyebrow: "Declaration", title: "Lines", flush: true, body:
        table([{ label: "Goods" }, { label: "HS code" }, { label: "Duty rate", align: "r" },
          { label: "Customs value", align: "r" }, { label: "Duty", align: "r" }, { label: "ATV", align: "r" },
          { label: "VAT", align: "r" }, { label: "" }],
          e.lines.map((l, i) => { const d = dutyForLine(l); return `<tr>
            <td class="p">${esc(l.description)}</td>
            <td><span class="mono">${esc(l.hsCode || "—")}</span>
              ${l.confirmed ? tag("Confirmed", "good") : tag("Unconfirmed", "warn")}</td>
            <td class="r tab">${pct(l.dutyRateBps)}</td>
            <td class="r tab">${money(l.customsValueCents)}</td>
            <td class="r tab">${money(d.duty)}</td>
            <td class="r tab muted">${money(d.atv)}</td>
            <td class="r tab p">${money(d.vat)}</td>
            <td class="r">${l.confirmed ? "" : `<button class="btn sm" data-act="confirmLine" data-id="${e.id}" data-i="${i}">Confirm</button>`}</td>
          </tr>`; })) })}

      ${panel({ eyebrow: "Classification", title: "Tariff lookup", body: `
        <div class="row" style="margin-bottom:11px">
          <input class="ctl" style="flex:1" id="hsq" placeholder="Describe the goods — cotton knitted shirts" value="${esc(e.lines[0] ? e.lines[0].description : "")}">
          <button class="btn" data-act="classify">Search the book</button>
        </div>
        <div id="hsres">${classifyRows(classify(e.lines[0] ? e.lines[0].description : ""))}</div>` })}
    </div>

    <div class="stack">
      ${panel({ eyebrow: "Payable", title: "Duty and VAT", body:
        kv("Customs value", money(t.customsValue))
        + kv("Duty", money(t.duty))
        + kv("Added-tax value", money(t.atv))
        + kv("VAT @ 15%", money(t.vat))
        + kv("Payable to SARS", `<span class="accent">${money(t.total)}</span>`, "tot")
        + `<p class="small muted" style="margin:10px 0 0">
            VAT is charged on the ATV, not on the customs value: value + duty + 10% upliftment on
            non-SACU imports. Computing it on the invoice value alone understates every entry.</p>` })}

      ${panel({ eyebrow: "SARS", title: "Electronic filing",
        actions: `<button class="btn sm" data-act="lodgeFiling" data-id="${e.id}">Build the submission</button>`, body:
        filing ? kv("Filing", `<span class="mono">${esc(filing.kind)}</span>`)
          + kv("State", tag(filing.status, filing.status === "QUEUED" ? "warn" : "good", true))
          + kv("Our reference", `<span class="mono">${esc(filing.submissionRef)}</span>`)
          + kv("Authority reference", filing.authorityRef ? `<span class="mono">${esc(filing.authorityRef)}</span>` : `<span class="muted">—</span>`)
          + (filing.lastError ? `<p class="small" style="margin:10px 0 0;color:var(--warning)">${esc(filing.lastError)}</p>` : "")
          : `<p class="small muted" style="margin:0">Nothing built yet. The declaration is validated against the tariff book and stored whether or not the EDI channel is configured — see <a href="#/integrations">External Systems</a>.</p>` })}
    </div></div>`;
});

const classifyRows = (rows) => rows.length
  ? rows.map((r) => `<div class="kv"><span class="k">
      <span class="mono p">${esc(r.hs)}</span> ${esc(r.desc)}</span>
      <span class="v">${pct(r.rateBps)} <span class="muted">· ${(r.confidence * 100).toFixed(0)}%</span></span></div>`).join("")
  : `<p class="small muted" style="margin:0">No candidate in the tariff extract matched.</p>`;

ACTIONS.classify = () => { $("#hsres").innerHTML = classifyRows(classify($("#hsq").value)); };
ACTIONS.confirmLine = (n) => {
  const e = S.entries.find((x) => x.id === n.dataset.id);
  const l = e.lines[Number(n.dataset.i)];
  if (!l.hsCode) { const g = classify(l.description)[0]; if (g) { l.hsCode = g.hs; l.dutyRateBps = g.rateBps; } }
  l.confirmed = true;
  toast("good", "Line confirmed", `${l.hsCode} at ${pct(l.dutyRateBps)} — a human has taken responsibility for the classification.`);
  render();
};
ACTIONS.submitEntry = (n) => {
  const e = S.entries.find((x) => x.id === n.dataset.id);
  e.status = "SUBMITTED";
  emit(S, { type: "entry.submitted", tenantId: e.tenantId, shipmentId: e.shipmentId,
    payload: { entryId: e.id, reference: e.reference, payable: money(entryTotals(e).total) } });
  lodgeFiling(S, e.shipmentId, "SARS_CUSDEC", { reference: e.reference, lines: e.lines.length });
  toast("info", "Entry lodged", "Built, validated and stored. The EDI channel is not configured, so it is queued for manual capture.");
  render();
};
ACTIONS.releaseEntry = (n) => {
  const e = S.entries.find((x) => x.id === n.dataset.id);
  const s = shipmentOf(e.shipmentId);
  e.status = "RELEASED";
  emit(S, { type: "entry.released", tenantId: e.tenantId, shipmentId: e.shipmentId, src: "SARS",
    payload: { entryId: e.id, reference: e.reference } });
  accrueFor(S, s, "entry.released");
  toast("good", "Released", `Duty and VAT of ${money(entryTotals(e).total)} accrued as a pass-through disbursement.`);
  render();
};
ACTIONS.lodgeFiling = (n) => {
  const e = S.entries.find((x) => x.id === n.dataset.id);
  const t = entryTotals(e);
  const f = lodgeFiling(S, e.shipmentId, "SARS_CUSDEC", { reference: e.reference,
    lines: e.lines.length, customsValue: money(t.customsValue), duty: money(t.duty), vat: money(t.vat) });
  toast(f.status === "QUEUED" ? "warn" : "good", `Filing ${f.status.toLowerCase()}`,
    f.lastError || `Lodged with SARS as ${f.authorityRef}.`);
  render();
};

ACTIONS.newParty = () => {
  const name = prompt("Party name");
  if (!name) return;
  const p = { id: uid(S, "p"), tenantId: tenantOf(S), name, country: "ZA", screening: "UNSCREENED",
    address: null, taxId: null, email: null, customerTenantId: null, createdAt: S.now };
  S.parties.push(p);
  /* Screened on creation, exactly as the real service does — and the verdict
     is recorded as an event whether it clears or not. */
  const hit = /orion|shell company|sanction/i.test(name);

  emit(S, { type: "party.screened", tenantId: p.tenantId, src: "yente",
    payload: { partyId: p.id, name, verdict: p.screening } });

    hit ? "A name match needs a human decision before this party can book." : "No watchlist match.");

};

/* ============================================================== invoices */

route(/^\/invoices$/, () => {
  markOverdue(S);
  const invs = S.invoices.filter((i) => i.tenantId === tenantOf(S));
  const open = invs.filter((i) => i.status !== "PAID" && i.status !== "CANCELLED");
  const owed = open.reduce((a, i) => a + Math.max(0, outstanding(i)), 0);
  const overdue = invs.filter((i) => i.status === "OVERDUE");
  const unaudited = invs.filter((i) => !i.auditedAt);

  return head({ eyebrow: "Finance", title: "Invoices",
    lede: "Charges are written by the event consumers as the freight moves — nobody keys them in. An invoice is a grouping of uninvoiced charges by currency, and a payment is only ever counted once however many times the bank redelivers it." })

  + `<div class="grid g4" style="margin-bottom:16px">
      ${tile("Invoices", String(invs.length))}
      ${tile("Owed", money(owed), { tone: owed ? "warn" : "good", sub: `${open.length} unsettled` })}
      ${tile("Overdue", String(overdue.length), { tone: overdue.length ? "bad" : "good" })}
      ${tile("Not yet audited", String(unaudited.length), { tone: unaudited.length ? "warn" : "good",
        sub: "Match before payment, not at month-end" })}
    </div>`

  + panel({ flush: true, body: table(
      [{ label: "Number" }, { label: "Customer" }, { label: "Shipment" }, { label: "Total", align: "r" },
       { label: "Paid", align: "r" }, { label: "Outstanding", align: "r" }, { label: "Due" },
       { label: "Status" }, { label: "Audit" }],
      invs.map((i) => { const s = shipmentOf(i.shipmentId); const paid = paidOn(S, i.id);

        return `<tr class="rowlink" data-go="/invoices/${i.id}">
          <td><span class="mono" style="color:var(--accent-strong)">${esc(i.number)}</span></td>
          <td class="p">${esc(i.billTo.name)}</td>

          <td class="r tab p">${money(i.totalCents, i.currency)}</td>

      <div class="scroll-x" style="margin-top:18px"><table class="tbl">
        <thead><tr><th>Charge</th><th>Basis</th><th class="r">Qty</th><th class="r">Unit</th>
          <th class="r">Cost</th><th class="r">Amount</th><th class="r">VAT</th></tr></thead>
        <tbody>${doc.sections.map((sec) => `
          <tr><td colspan="7" class="eyebrow mute" style="padding-top:12px">${esc(sec.label)}</td></tr>
          ${sec.lines.map((l) => `<tr>
            <td><span class="mono muted" style="font-size:10.5px">${esc(l.code)}</span>
              <span class="p">${esc(l.description)}</span>
              ${l.disputed ? tag("Queried", "warn") : ""}
              <div style="margin-top:3px">${tag(PROV_LABEL[l.prov], PROV_TAG[l.prov])}

            <td class="muted">${esc(basisPhrase(l.basis))}</td>

             ["Third-party services", doc.totals.markedUp],
             ["Our own services", doc.totals.own]].map(([l, v]) => `
            <div class="split-row" style="margin-bottom:6px">
              <span class="lbl">${esc(l)}</span>

            const service = doc.lines.filter((l) => !(l.prov === "PASS_THROUGH" && l.buyCents === l.sellCents));
            const sell = service.reduce((a, l) => a + l.sellCents, 0);

              or deflating the ratio.` : ""}
